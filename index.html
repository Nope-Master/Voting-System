<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextCR Voting System</title>
<style>
:root{
--navy:#0a0e27;--deep-blue:#0d1b3e;--dark-purple:#1a0a2e;
--aurora-green:#00ff87;--aurora-cyan:#00d4ff;--aurora-purple:#b44aff;
--aurora-gold:#ffd700;
--glass-bg:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.12);
--error-red:#ff4757;--success-green:#00ff87;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
background:var(--navy);background-image:url('static/images/bg.jpg');
background-size:cover;background-position:center;background-attachment:fixed;
min-height:100vh;color:#e0e0e0;overflow-x:hidden;
}
body::before{
content:'';position:fixed;top:0;left:0;width:100%;height:100%;
background:linear-gradient(135deg,rgba(10,14,39,0.88) 0%,rgba(13,27,62,0.82) 40%,rgba(26,10,46,0.88) 100%);
z-index:0;pointer-events:none;
}
.snowfall{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.snowflake{position:absolute;background:#fff;border-radius:50%;animation:snowAnim linear infinite;}
@keyframes snowAnim{
0%{transform:translateY(-10px) translateX(0);opacity:0.8}
50%{transform:translateY(50vh) translateX(-10px);opacity:0.6}
100%{transform:translateY(105vh) translateX(5px);opacity:0}
}
#app{position:relative;z-index:2;min-height:100vh;}
.page-wrap{padding:70px 20px 40px;min-height:100vh;}
.page-center{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 120px);}
.container{max-width:1100px;margin:0 auto;}

/* NAVBAR */
.navbar{
position:fixed;top:0;left:0;width:100%;z-index:100;
padding:12px 20px;display:flex;justify-content:space-between;align-items:center;
background:rgba(10,14,39,0.85);backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,0.06);
}
.nav-brand{font-size:1.15rem;font-weight:800;cursor:pointer;
background:linear-gradient(135deg,var(--aurora-green),var(--aurora-cyan));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
border:none;letter-spacing:1px;text-transform:uppercase;user-select:none;}
.nav-links{display:flex;gap:6px;align-items:center;}
.nav-links-desktop{display:flex;gap:6px;}
.hamburger{display:none;background:none;border:none;color:#e0e0e0;font-size:1.4rem;cursor:pointer;padding:4px 8px;}
.mobile-menu{display:none;position:fixed;top:50px;left:0;width:100%;background:rgba(10,14,39,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.1);padding:12px 20px;z-index:99;flex-direction:column;gap:8px;}
.mobile-menu.open{display:flex;}

/* GLASS */
.glass{
background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
border:1px solid var(--glass-border);border-radius:16px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
transition:all 0.2s ease;position:relative;overflow:hidden;
}
.glass:hover{border-color:rgba(255,255,255,0.2);}

/* BUTTONS */
.btn{
padding:9px 22px;border-radius:50px;border:none;font-weight:600;
font-size:0.85rem;cursor:pointer;transition:all 0.2s ease;
display:inline-flex;align-items:center;justify-content:center;gap:6px;
text-decoration:none;font-family:inherit;line-height:1.4;color:#e0e0e0;background:none;
}
.btn-primary{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#fff;box-shadow:0 4px 15px rgba(0,212,255,0.25);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,212,255,0.4);}
.btn-secondary{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);}
.btn-secondary:hover{background:rgba(255,255,255,0.14);transform:translateY(-1px);}
.btn-danger{background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;box-shadow:0 4px 15px rgba(255,71,87,0.25);}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,71,87,0.4);}
.btn-purple{background:linear-gradient(135deg,var(--aurora-purple),#8b5cf6);color:#fff;box-shadow:0 4px 15px rgba(180,74,255,0.25);}
.btn-purple:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(180,74,255,0.4);}
.btn-success{background:linear-gradient(135deg,#00cc6a,#00ff87);color:#0a0e27;font-weight:700;box-shadow:0 4px 15px rgba(0,255,135,0.25);}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,255,135,0.4);}
.btn-warning{background:linear-gradient(135deg,#ffa502,#ff6348);color:#fff;box-shadow:0 4px 15px rgba(255,165,2,0.25);}
.btn-warning:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,165,2,0.4);}
.btn-sm{padding:7px 16px;font-size:0.8rem;}
.btn-xs{padding:4px 12px;font-size:0.75rem;}
.btn-lg{padding:13px 34px;font-size:0.95rem;}
.btn-full{width:100%;justify-content:center;}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important;}
.btn-back{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);padding:6px 16px;font-size:0.78rem;}
.btn-back:hover{background:rgba(255,255,255,0.12);color:#fff;}

/* CARD */
.card{padding:32px;max-width:460px;width:100%;margin:0 auto;}
.card-wide{max-width:600px;}
.card-title{font-size:1.35rem;font-weight:800;text-align:center;margin-bottom:16px;color:#fff;}

/* INPUTS */
.input-glass{
width:100%;padding:11px 14px;
background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
border-radius:11px;color:#e0e0e0;font-size:0.86rem;font-family:inherit;
transition:all 0.2s ease;outline:none;
}
.input-glass:focus{border-color:var(--aurora-cyan);box-shadow:0 0 15px rgba(0,212,255,0.12);background:rgba(255,255,255,0.06);}
.input-glass::placeholder{color:rgba(255,255,255,0.2);}
.input-glass.input-error{border-color:var(--error-red)!important;animation:inputShake 0.35s ease;}
.input-glass.input-success{border-color:var(--success-green)!important;}
@keyframes inputShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.input-group{margin-bottom:14px;}
.input-group label{display:block;margin-bottom:4px;font-size:0.78rem;font-weight:500;color:rgba(255,255,255,0.5);}
.input-row{position:relative;}
.input-row .input-glass{padding-right:56px;}
.toggle-pw{
position:absolute;right:4px;top:50%;transform:translateY(-50%);
cursor:pointer;color:rgba(255,255,255,0.4);font-size:0.74rem;font-weight:600;
background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
border-radius:8px;padding:5px 9px;font-family:inherit;transition:all 0.2s;
}
.toggle-pw:hover{color:var(--aurora-cyan);border-color:var(--aurora-cyan);}
.pin-input{text-align:center;font-size:1.2rem;letter-spacing:8px;}
.field-error{font-size:0.7rem;color:var(--error-red);margin-top:3px;display:none;}
.field-error.show{display:block;}
.field-success{font-size:0.7rem;color:var(--success-green);margin-top:3px;display:none;}
.field-success.show{display:block;}
.pw-strength{margin-top:4px;display:flex;gap:3px;align-items:center;}
.pw-bar{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,0.08);transition:all 0.3s;}
.pw-bar.active{background:var(--error-red);}
.pw-bar.medium{background:#ffa502;}
.pw-bar.strong{background:var(--aurora-green);}
.pw-label{font-size:0.66rem;margin-left:6px;color:rgba(255,255,255,0.4);min-width:40px;}
.contact-row{display:flex;gap:0;align-items:center;}
.contact-prefix{
padding:11px 10px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);
border-radius:11px 0 0 11px;border-right:none;color:var(--aurora-cyan);font-size:0.86rem;font-weight:700;white-space:nowrap;
}
.contact-row .input-glass{border-radius:0 11px 11px 0;}

/* PHOTO */
.photo-upload-area{
display:flex;align-items:center;gap:14px;padding:14px;
background:rgba(255,255,255,0.02);border:2px dashed rgba(255,255,255,0.1);
border-radius:12px;cursor:pointer;transition:all 0.3s;
}
.photo-upload-area:hover{border-color:var(--aurora-cyan);background:rgba(0,212,255,0.03);}
.photo-upload-preview{
width:52px;height:52px;border-radius:50%;object-fit:cover;
background:rgba(0,212,255,0.08);border:2px solid rgba(0,212,255,0.3);
display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
}
.photo-upload-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.photo-upload-text{font-size:0.8rem;color:rgba(255,255,255,0.35);}
.photo-upload-text strong{color:var(--aurora-cyan);font-weight:600;}
.photo-upload-input{display:none;}

/* CROP MODAL */
.crop-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(8px);}
.crop-modal.active{display:flex;}
.crop-container{position:relative;width:280px;height:280px;overflow:hidden;border-radius:50%;border:3px solid var(--aurora-cyan);box-shadow:0 0 40px rgba(0,212,255,0.25);}
.crop-container img{position:absolute;cursor:grab;user-select:none;-webkit-user-select:none;}
.crop-container img:active{cursor:grabbing;}
.crop-controls{display:flex;gap:12px;align-items:center;}
.crop-controls input[type=range]{width:160px;accent-color:var(--aurora-cyan);}
.crop-controls label{font-size:0.78rem;color:rgba(255,255,255,0.5);}

/* TEXT */
.text-muted{color:rgba(255,255,255,0.5);font-size:0.86rem;}
.text-sm{color:rgba(255,255,255,0.4);font-size:0.78rem;}
.divider{text-align:center;margin:10px 0;color:rgba(255,255,255,0.15);font-size:0.78rem;}
.form-foot{text-align:center;margin-top:12px;font-size:0.78rem;color:rgba(255,255,255,0.3);}
.form-foot a{color:var(--aurora-cyan);text-decoration:none;cursor:pointer;}
.form-foot a:hover{text-decoration:underline;}
.glow-green{color:var(--aurora-green);}
.glow-cyan{color:var(--aurora-cyan);}

/* WELCOME */
.welcome-banner{padding:22px 24px;margin-bottom:18px;text-align:center;background:linear-gradient(135deg,rgba(0,212,255,0.06),rgba(180,74,255,0.06))!important;}
.welcome-text{font-size:1.35rem;font-weight:700;color:#fff;}
.welcome-name{
background:linear-gradient(135deg,var(--aurora-green),var(--aurora-cyan));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;font-size:1.4rem;
}

/* PHOTOS */
.photo-lg{width:85px;height:85px;border-radius:50%;object-fit:cover;border:2px solid var(--aurora-cyan);box-shadow:0 0 15px rgba(0,212,255,0.15);}
.photo-placeholder{width:85px;height:85px;border-radius:50%;
background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(180,74,255,0.15));
border:2px solid rgba(0,212,255,0.3);display:flex;align-items:center;justify-content:center;
font-size:1.8rem;color:rgba(0,212,255,0.5);}
.photo-xl{width:100px;height:100px;}

/* CR CARD */
.cr-card{display:flex;align-items:center;gap:20px;padding:24px;margin-bottom:20px;
background:linear-gradient(135deg,rgba(0,212,255,0.04),rgba(180,74,255,0.04))!important;}
.cr-info h3{font-size:1.1rem;font-weight:700;margin-bottom:4px;}
.cr-badge{display:inline-block;padding:4px 14px;border-radius:50px;font-size:0.7rem;font-weight:700;
background:linear-gradient(135deg,var(--aurora-green),var(--aurora-cyan));color:#0a0e27;margin-bottom:5px;}
.cr-detail-item{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;margin:2px;
background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);
border-radius:50px;font-size:0.7rem;color:rgba(255,255,255,0.5);}
.cr-detail-item strong{color:var(--aurora-cyan);font-weight:600;}

/* BADGES */
.status-badge{display:inline-block;padding:5px 16px;border-radius:50px;font-size:0.78rem;font-weight:600;}
.badge-open{background:rgba(0,255,135,0.1);color:var(--aurora-green);border:1px solid rgba(0,255,135,0.2);}
.badge-closed{background:rgba(255,71,87,0.1);color:#ff6b81;border:1px solid rgba(255,71,87,0.15);}
.badge-done{background:rgba(0,255,135,0.12);color:var(--aurora-green);border:1px solid rgba(0,255,135,0.2);}
.badge-idle{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.08);}

/* ELECTION STATUS */
.election-status-home{padding:20px;margin-bottom:18px;text-align:center;
background:linear-gradient(135deg,rgba(0,212,255,0.03),rgba(180,74,255,0.03))!important;}
.election-status-home h3{font-size:0.9rem;font-weight:600;margin-bottom:10px;color:rgba(255,255,255,0.5);}
.timer-display{margin-top:8px;font-size:0.85rem;color:rgba(255,255,255,0.4);}
.timer-display .timer-value{font-weight:700;color:var(--aurora-cyan);font-size:1.1rem;}

/* STEPPER */
.stepper{display:flex;align-items:center;justify-content:center;gap:0;margin:14px 0 12px;}
.step-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:0.7rem;font-weight:700;border:2px solid rgba(255,255,255,0.12);
color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.03);transition:all 0.3s;}
.step-dot.active{border-color:var(--aurora-cyan);color:var(--aurora-cyan);background:rgba(0,212,255,0.1);}
.step-dot.done{border-color:var(--aurora-green);color:#0a0e27;background:var(--aurora-green);}
.step-line{width:24px;height:2px;background:rgba(255,255,255,0.08);margin:0 2px;transition:all 0.3s;}
.step-line.done{background:linear-gradient(90deg,var(--aurora-green),var(--aurora-cyan));}
.step-wrap{display:flex;flex-direction:column;align-items:center;}
.step-label{font-size:0.58rem;color:rgba(255,255,255,0.25);text-align:center;margin-top:3px;}
.step-label.active{color:var(--aurora-cyan);}
.step-label.done{color:var(--aurora-green);}

/* GAUGE */
.turnout-gauge{display:flex;align-items:center;gap:10px;margin:10px 0;}
.gauge-bar-bg{flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;}
.gauge-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--aurora-green),var(--aurora-cyan));transition:width 1s ease;}
.gauge-pct{font-size:0.85rem;font-weight:700;color:var(--aurora-cyan);min-width:40px;text-align:right;}

/* TIMER SETUP */
.timer-setup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.timer-unit{display:flex;flex-direction:column;align-items:center;gap:3px;}
.timer-unit input{width:60px;text-align:center;padding:8px 5px;font-size:0.9rem;}
.timer-unit span{font-size:0.66rem;color:rgba(255,255,255,0.3);text-transform:uppercase;}

/* DASHBOARD */
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{padding:18px;text-align:center;background:linear-gradient(135deg,rgba(0,212,255,0.03),rgba(180,74,255,0.03))!important;}
.stat-num{font-size:1.7rem;font-weight:800;
background:linear-gradient(135deg,var(--aurora-green),var(--aurora-cyan));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{font-size:0.68rem;color:rgba(255,255,255,0.35);margin-top:3px;text-transform:uppercase;letter-spacing:0.8px;}

/* TABS */
.tab-bar{display:flex;gap:2px;background:rgba(255,255,255,0.03);border-radius:12px;padding:3px;margin-bottom:18px;overflow-x:auto;}
.tab-btn{padding:8px 16px;border-radius:9px;border:none;background:transparent;
color:rgba(255,255,255,0.35);font-weight:600;font-size:0.8rem;cursor:pointer;
transition:all 0.2s;white-space:nowrap;font-family:inherit;}
.tab-btn.active{background:rgba(255,255,255,0.1);color:#fff;}
.tab-btn:hover:not(.active){color:rgba(255,255,255,0.7);}

/* TABLE */
.table-wrap{overflow-x:auto;}
.data-table{width:100%;border-collapse:separate;border-spacing:0 3px;}
.data-table th{padding:8px 10px;text-align:left;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:rgba(255,255,255,0.3);}
.data-table td{padding:9px 10px;background:rgba(255,255,255,0.02);font-size:0.8rem;}
.data-table tr td:first-child{border-radius:9px 0 0 9px;}
.data-table tr td:last-child{border-radius:0 9px 9px 0;}
.data-table tbody tr:hover td{background:rgba(0,212,255,0.04);}
.search-box{margin-bottom:12px;}
.search-box input{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:8px 12px;color:#e0e0e0;font-size:0.8rem;width:100%;max-width:280px;font-family:inherit;outline:none;transition:all 0.2s;}
.search-box input:focus{border-color:var(--aurora-cyan);}
.search-box input::placeholder{color:rgba(255,255,255,0.15);}
.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}

/* VOTE */
.vote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.vote-card{padding:22px;text-align:center;cursor:pointer;transition:all 0.25s;position:relative;
background:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02))!important;}
.vote-card:hover{transform:translateY(-4px);border-color:var(--aurora-cyan);box-shadow:0 8px 30px rgba(0,212,255,0.12);}
.vote-card.selected{border-color:var(--aurora-green)!important;box-shadow:0 0 25px rgba(0,255,135,0.15)!important;
background:linear-gradient(135deg,rgba(0,255,135,0.06),rgba(0,212,255,0.03))!important;transform:translateY(-4px);}
.vote-card .checkmark{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
background:var(--aurora-green);color:#0a0e27;display:none;align-items:center;justify-content:center;font-weight:700;font-size:0.78rem;}
.vote-card.selected .checkmark{display:flex;}
.vote-avatar{width:52px;height:52px;border-radius:50%;
background:linear-gradient(135deg,var(--aurora-cyan),var(--aurora-purple));
display:flex;align-items:center;justify-content:center;margin:0 auto 10px;
font-size:1.2rem;font-weight:700;color:#fff;overflow:hidden;}
.vote-avatar img{width:100%;height:100%;object-fit:cover;}
.vote-bio{font-size:0.7rem;color:rgba(255,255,255,0.3);margin-top:5px;font-style:italic;max-height:36px;overflow:hidden;}
.vote-warning-banner{display:flex;align-items:center;gap:12px;padding:16px 20px;margin-bottom:18px;
border-color:rgba(255,165,2,0.3)!important;background:linear-gradient(135deg,rgba(255,165,2,0.06),rgba(255,99,72,0.04))!important;}
.vote-warning-icon{font-size:1.6rem;flex-shrink:0;}
.vote-warning-text{font-size:0.8rem;color:rgba(255,255,255,0.6);line-height:1.4;}
.vote-warning-text strong{color:#ffa502;font-size:0.85rem;}
.selected-candidate-display{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;margin-bottom:14px;
background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.15);border-radius:12px;}
.already-voted-check{width:70px;height:70px;border-radius:50%;background:var(--aurora-green);
display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.already-voted-check span{font-size:2.2rem;color:#0a0e27;}

/* VOTE SUCCESS */
.vote-success-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);
z-index:600;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(8px);}
.vote-success-overlay.active{display:flex;}
.vote-check{width:90px;height:90px;border-radius:50%;background:var(--aurora-green);
display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(0,255,135,0.35);}
.vote-check span{font-size:2.8rem;color:#0a0e27;}
.vote-receipt{font-size:0.76rem;color:rgba(255,255,255,0.35);text-align:center;margin-top:6px;}

/* RESULTS */

.chat-msg-actions{display:none;position:absolute;top:-8px;right:-4px;gap:3px;background:rgba(10,14,39,0.95);border-radius:8px;padding:3px;border:1px solid rgba(255,255,255,0.1);}
.chat-msg:hover .chat-msg-actions{display:flex;}
.chat-msg-act-btn{background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:0.7rem;padding:3px 6px;border-radius:5px;font-family:inherit;transition:all 0.15s;}

.chat-input-area{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,0.06);align-items:flex-end;}

/* STUDENT MENU */
.student-menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px;}

.request-card{padding:20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}

/* ANIMATIONS */

}

<body>

<div class="confirm-box">
<h3 id="confirmTitle">Confirm</h3>

<button class="btn btn-secondary btn-sm" id="confirmNo">Cancel</button>

</div>
</div>

<p style="color:rgba(255,255,255,0.4);font-size:0.85rem;max-width:320px;text-align:center;">Your vote has been recorded securely. You cannot vote again in this round.</p>

<button class="btn btn-primary btn-sm" style="margin-top:10px;" id="voteSuccessCloseBtn">Continue</button>
</div>

<div id="app"></div>

<script>
(function(){
'use strict';

var DB_KEY='nextcr_db',SESSION_KEY='nextcr_session',PAGE_KEY='nextcr_page',LOG_KEY='nextcr_log',CHAT_KEY='nextcr_chat';
var DETAIL_OPTIONS=['Achievements','Hobbies','Experience','Skills','Certifications','Languages','Sports','Clubs','Volunteer Work','Projects','Interests','Leadership'];
var SEC_QUESTIONS=['What is your favourite Color?','What is your favourite Food?','What is your favourite Movie?','What is your favourite Sport?','What is your favourite Animal?','What is your favourite Teacher\'s name?','What is your favourite Book?','What is your favourite Place?','What is your favourite Song?','What is your favourite Game?','What is your favourite Character?'];

var currentPage='home',adminTab='election',selectedCandId=null,_confirmCb=null,_pageHistory=[];
var cropState={targetInput:null,targetPreview:null,scale:1,ox:0,oy:0,dragging:false,sx:0,sy:0,baseW:0,baseH:0};
var votingTimer=null,mobileMenuOpen=false,chatEditId=null,chatTarget='all';
var _serverSync=false,_syncTimer=null;

/* ===== DATABASE ===== */
function initDB(cb){
  fetchFromServer(function(serverDb){
    if(serverDb){
      localStorage.setItem(DB_KEY,JSON.stringify(serverDb));
      _serverSync=true;
    }
    if(!localStorage.getItem(DB_KEY)){
      var db={
        ValidStudentIDs:[],Students:[],Admins:[],Candidates:[],CandidateRequests:[],
        AdminUnlockPin:'',
        VotingSettings:{current_round:0,status:'NotStarted',qualification_limit:5,semi_results_declared:false,final_results_declared:false,round_start_time:null,round_duration:null},
        CurrentCR:{name:'Not Assigned Yet',photo:'',contact_no:'',about:'',profile_details:[]}
      };
      localStorage.setItem(DB_KEY,JSON.stringify(db));
    }
    migrateDB();
    if(cb)cb();
  });
}

function migrateDB(){
  var db=loadDB();if(!db)return;var c=false;
  if(!db.AdminUnlockPin&&db.AdminUnlockPin!==''){db.AdminUnlockPin='';c=true;}
  if(!db.CurrentCR){db.CurrentCR={name:'Not Assigned Yet',photo:'',contact_no:'',about:'',profile_details:[]};c=true;}
  if(!db.CurrentCR.profile_details){db.CurrentCR.profile_details=[];c=true;}
  if(db.CurrentCR.about===undefined){db.CurrentCR.about='';c=true;}
  if(!db.VotingSettings){db.VotingSettings={current_round:0,status:'NotStarted',qualification_limit:5,semi_results_declared:false,final_results_declared:false,round_start_time:null,round_duration:null};c=true;}
  if(db.VotingSettings.round_start_time===undefined){db.VotingSettings.round_start_time=null;c=true;}
  if(db.VotingSettings.round_duration===undefined){db.VotingSettings.round_duration=null;c=true;}
  if(!db.CandidateRequests){db.CandidateRequests=[];c=true;}
  if(!db.Candidates)db.Candidates=[];
  if(!db.Students)db.Students=[];
  if(!db.Admins)db.Admins=[];
  if(!db.ValidStudentIDs)db.ValidStudentIDs=[];
  for(var i=0;i<db.Students.length;i++){
    if(!db.Students[i].profile_details){db.Students[i].profile_details=[];c=true;}
    if(db.Students[i].photo===undefined){db.Students[i].photo='';c=true;}
    if(db.Students[i].about===undefined){db.Students[i].about='';c=true;}
    if(db.Students[i].security_question===undefined){db.Students[i].security_question='';c=true;}
    if(db.Students[i].security_answer_hash===undefined){db.Students[i].security_answer_hash='';c=true;}
  }
  for(var i=0;i<db.Admins.length;i++){
    if(!db.Admins[i].profile_details){db.Admins[i].profile_details=[];c=true;}
    if(db.Admins[i].photo===undefined){db.Admins[i].photo='';c=true;}
    if(db.Admins[i].about===undefined){db.Admins[i].about='';c=true;}
  }
  for(var i=0;i<db.Candidates.length;i++){
    if(db.Candidates[i].bio===undefined){db.Candidates[i].bio='';c=true;}
  }
  if(c)localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function fetchFromServer(cb){
  try{
    var xhr=new XMLHttpRequest();
    xhr.open('GET','/api/db/load',true);
    xhr.timeout=15000;
    xhr.onload=function(){if(xhr.status===200){try{var r=JSON.parse(xhr.responseText);if(r.ok&&r.db){cb(r.db);return;}}catch(e){}}cb(null);};
    xhr.onerror=function(){cb(null);};
    xhr.ontimeout=function(){cb(null);};
    xhr.send();
  }catch(e){cb(null);}
}

function syncToServer(db){
  if(!_serverSync)return;
  try{
    var xhr=new XMLHttpRequest();
    xhr.open('POST','/api/db/save',true);
    xhr.setRequestHeader('Content-Type','application/json');
    xhr.timeout=30000;
    xhr.send(JSON.stringify({db:JSON.parse(JSON.stringify(db))}));
  }catch(e){}
}

function debouncedSync(db){if(_syncTimer)clearTimeout(_syncTimer);_syncTimer=setTimeout(function(){syncToServer(db);},400);}

function loadDB(){try{var d=JSON.parse(localStorage.getItem(DB_KEY));return d&&typeof d==='object'?d:null;}catch(e){return null;}}
function saveDB(db){try{localStorage.setItem(DB_KEY,JSON.stringify(db));debouncedSync(db);}catch(e){toast('Storage error','error');}}
function getSession(){try{var s=localStorage.getItem(SESSION_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function setSession(d){localStorage.setItem(SESSION_KEY,JSON.stringify(d));}
function clearSession(){localStorage.removeItem(SESSION_KEY);localStorage.removeItem(PAGE_KEY);}
function savePage(){localStorage.setItem(PAGE_KEY,JSON.stringify({page:currentPage,tab:adminTab}));}
function loadSavedPage(){try{var s=localStorage.getItem(PAGE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ===== UTILS ===== */
function uid(){return Math.random().toString(36).substr(2,10)+Date.now().toString(36);}
function esc(t){if(t==null)return '';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hashPw(s){
  if(!s)return 'h_0_0_0';
  var h=0,h2=0,h3=0;
  for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h=((h<<5)-h)+c;h|=0;h2=((h2<<7)-h2)+c;h2|=0;h3=((h3<<11)-h3)+c;h3|=0;}
  for(var i=s.length-1;i>=0;i--){var c=s.charCodeAt(i);h=((h<<3)-h)+c*31;h|=0;h2=((h2<<5)-h2)+c*37;h2|=0;}
  return 'h_'+Math.abs(h).toString(36)+'_'+Math.abs(h2).toString(36)+'_'+Math.abs(h3).toString(36)+'_'+s.length;
}
function addLog(msg){var logs;try{logs=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){logs=[];}logs.unshift({time:Date.now(),msg:String(msg)});if(logs.length>50)logs=logs.slice(0,50);try{localStorage.setItem(LOG_KEY,JSON.stringify(logs));}catch(e){}}
function getLogs(){try{return JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){return [];}}
function loadChats(){try{return JSON.parse(localStorage.getItem(CHAT_KEY)||'[]');}catch(e){return [];}}
function saveChats(c){try{localStorage.setItem(CHAT_KEY,JSON.stringify(c));}catch(e){}}
function getUnreadCount(){var s=getSession();if(!s)return 0;var chats=loadChats();var last=parseInt(localStorage.getItem('lastChatRead_'+s.user_id)||'0');var count=0;for(var i=0;i<chats.length;i++){if(chats[i].time>last&&chats[i].userId!==s.user_id&&!chats[i].deletedForAll){if(!chats[i].privateTo||chats[i].privateTo===s.user_id||chats[i].userId===s.user_id)count++;}}return count;}

function toast(m,t){

  var d=document.createElement('div');
  d.className='toast toast-'+({success:'ok',error:'err',info:'info',warning:'warn'}[t]||'info');

}

function showFieldError(id,m){var e=document.getElementById(id);if(e){e.textContent=m;e.classList.add('show');}}
function hideFieldError(id){var e=document.getElementById(id);if(e){e.textContent='';e.classList.remove('show');}}

function validateFieldLive(iid,eid,fn,em){
  var el=document.getElementById(iid);if(!el)return;var v=el.value.trim();
  if(!v){hideFieldError(eid);setInputState(iid,'');return;}
  if(!fn(v)){showFieldError(eid,em);setInputState(iid,'error');}
  else{hideFieldError(eid);setInputState(iid,'success');}
}

function updatePwStrength(inputId,barPrefix){
  var el=document.getElementById(inputId);if(!el)return;var v=el.value;var score=0;
  if(v.length>=4)score++;if(v.length>=8)score++;
  if(/[A-Z]/.test(v)&&/[a-z]/.test(v))score++;if(/\d/.test(v))score++;if(/[^a-zA-Z0-9]/.test(v))score++;
  var cls=['','active','medium','medium','strong','strong'];
  for(var i=1;i<=4;i++){var bar=document.getElementById(barPrefix+i);if(!bar)continue;bar.className='pw-bar';if(i<=score)bar.classList.add(cls[score]||'active');}
  var lbl=document.getElementById(barPrefix+'label');
  if(lbl){var labels=['','Weak','Fair','Good','Strong','Very Strong'];lbl.textContent=score>0?labels[score]:'';}
}

/* ===== PHOTO ===== */
function handlePhotoUpload(inputId,previewId){
  var input=document.getElementById(inputId);if(!input||!input.files||!input.files[0])return;
  var file=input.files[0];
  var valid=['image/jpeg','image/png','image/gif','image/webp'];
  if(valid.indexOf(file.type)===-1){toast('Only JPG, PNG, GIF, WEBP allowed','error');input.value='';return;}
  if(file.size>2*1024*1024){toast('Image must be under 2MB','error');input.value='';return;}
  var r=new FileReader();
  r.onload=function(e){openCropModal(e.target.result,inputId,previewId);};
  r.onerror=function(){toast('Failed to read file','error');};
  r.readAsDataURL(file);
}

function openCropModal(imgData,inputId,previewId){
  cropState={targetInput:inputId,targetPreview:previewId,scale:1,ox:0,oy:0,dragging:false,sx:0,sy:0,baseW:0,baseH:0};
  var modal=document.getElementById('cropModal');
  var img=document.getElementById('cropImg');
  img.src=imgData;
  document.getElementById('cropZoom').value=100;
  modal.classList.add('active');
  img.onload=function(){
    var cw=280,ch=280;
    var ratio=Math.max(cw/img.naturalWidth,ch/img.naturalHeight);
    var w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;
    img.style.width=w+'px';img.style.height=h+'px';
    img.style.left=((cw-w)/2)+'px';img.style.top=((ch-h)/2)+'px';
    cropState.baseW=w;cropState.baseH=h;cropState.ox=(cw-w)/2;cropState.oy=(ch-h)/2;
  };
}

function cropZoomHandler(){
  var v=parseInt(document.getElementById('cropZoom').value)/100;
  var img=document.getElementById('cropImg');if(!img)return;
  img.style.width=(cropState.baseW*v)+'px';img.style.height=(cropState.baseH*v)+'px';
  cropState.scale=v;
}
function cropMouseDown(e){cropState.dragging=true;cropState.sx=e.clientX;cropState.sy=e.clientY;e.preventDefault();}
function cropMouseMove(e){
  if(!cropState.dragging)return;var img=document.getElementById('cropImg');if(!img)return;
  cropState.ox+=e.clientX-cropState.sx;cropState.oy+=e.clientY-cropState.sy;
  img.style.left=cropState.ox+'px';img.style.top=cropState.oy+'px';
  cropState.sx=e.clientX;cropState.sy=e.clientY;
}
function cropMouseUp(){cropState.dragging=false;}
function cropTouchStart(e){if(e.touches.length===1){cropState.dragging=true;cropState.sx=e.touches[0].clientX;cropState.sy=e.touches[0].clientY;e.preventDefault();}}
function cropTouchMove(e){
  if(!cropState.dragging||!e.touches.length)return;var img=document.getElementById('cropImg');if(!img)return;
  cropState.ox+=e.touches[0].clientX-cropState.sx;cropState.oy+=e.touches[0].clientY-cropState.sy;
  img.style.left=cropState.ox+'px';img.style.top=cropState.oy+'px';
  cropState.sx=e.touches[0].clientX;cropState.sy=e.touches[0].clientY;
}

function cropApply(){
  var canvas=document.createElement('canvas');canvas.width=280;canvas.height=280;
  var ctx=canvas.getContext('2d');
  var img=document.getElementById('cropImg');
  var cont=document.getElementById('cropContainer');
  if(!img||!cont)return;
  var rect=cont.getBoundingClientRect();var imgRect=img.getBoundingClientRect();
  if(imgRect.width===0||imgRect.height===0)return;
  var sx=(rect.left-imgRect.left)*(img.naturalWidth/imgRect.width);
  var sy=(rect.top-imgRect.top)*(img.naturalHeight/imgRect.height);
  var sw=rect.width*(img.naturalWidth/imgRect.width);
  var sh=rect.height*(img.naturalHeight/imgRect.height);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,280,280);
  var data=canvas.toDataURL('image/jpeg',0.82);
  var prev=document.getElementById(cropState.targetPreview);
  if(prev)prev.innerHTML='<img src="'+data+'">';
  if(!window._photoData)window._photoData={};
  window._photoData[cropState.targetInput]=data;
  document.getElementById('cropModal').classList.remove('active');
  toast('Photo cropped!','success');
}
function cropCancel(){document.getElementById('cropModal').classList.remove('active');}

/* ===== TIMER ===== */
function startTimer(){if(votingTimer)clearInterval(votingTimer);votingTimer=setInterval(timerTick,1000);timerTick();}
function stopTimer(){if(votingTimer){clearInterval(votingTimer);votingTimer=null;}}
function timerTick(){updateTimerDisplay();checkTimerExpiry();}
function updateTimerDisplay(){
  var el=document.getElementById('timerDisplay');if(!el)return;
  var db=loadDB();if(!db)return;var vs=db.VotingSettings;
  if(vs.status!=='Open'){el.innerHTML='';return;}
  if(!vs.round_duration){el.innerHTML='<span class="timer-value">No time limit</span>';return;}
  if(!vs.round_start_time){el.innerHTML='';return;}
  var elapsed=Math.floor((Date.now()-vs.round_start_time)/1000);
  var remaining=Math.max(0,vs.round_duration-elapsed);
  if(remaining<=0){el.innerHTML='<span class="timer-value" style="color:#ff6b81;">Time\'s up!</span>';return;}
  var d=Math.floor(remaining/86400),h=Math.floor((remaining%86400)/3600),m=Math.floor((remaining%3600)/60),sec=remaining%60;
  var parts=[];if(d>0)parts.push(d+'d');if(h>0)parts.push(h+'h');parts.push(m+'m');parts.push(sec+'s');
  el.innerHTML='Time remaining: <span class="timer-value">'+parts.join(' ')+'</span>';
}
function checkTimerExpiry(){
  var db=loadDB();if(!db)return;var vs=db.VotingSettings;
  if(vs.status!=='Open'||!vs.round_start_time||!vs.round_duration)return;
  var elapsed=Math.floor((Date.now()-vs.round_start_time)/1000);
  if(elapsed>=vs.round_duration){
    vs.status='Closed';vs.round_start_time=null;vs.round_duration=null;
    saveDB(db);addLog('Round '+vs.current_round+' auto-closed (timer)');
    toast('Voting closed - timer expired','warning');navigate('home');
  }
}
function getTimerSeconds(){
  var dE=document.getElementById('timerDays'),hE=document.getElementById('timerHours'),mE=document.getElementById('timerMins'),sE=document.getElementById('timerSecs');
  if(!dE)return null;
  var d=parseInt(dE.value)||0,h=parseInt(hE.value)||0,m=parseInt(mE.value)||0,s=parseInt(sE.value)||0;
  var total=d*86400+h*3600+m*60+s;return total>0?total:null;
}

/* ===== STEPPER ===== */
function stepperHTML(){
  var db=loadDB();if(!db)return '';var vs=db.VotingSettings;
  var steps=[{l:'Setup',n:1},{l:'Round 1',n:2},{l:'Semi',n:3},{l:'Round 2',n:4},{l:'Final',n:5}];
  var activeStep=0;
  if(vs.status==='NotStarted')activeStep=0;
  else if(vs.current_round===1&&vs.status==='Open')activeStep=1;
  else if(vs.current_round===1&&vs.status==='Closed'&&!vs.semi_results_declared)activeStep=2;
  else if(vs.semi_results_declared&&vs.current_round!==2)activeStep=2;
  else if(vs.current_round===2&&vs.status==='Open')activeStep=3;
  else if(vs.current_round===2&&vs.status==='Closed'&&!vs.final_results_declared)activeStep=4;
  else if(vs.final_results_declared)activeStep=5;
  var h='<div class="stepper">';
  for(var i=0;i<steps.length;i++){
    var done=i<activeStep,active=i===activeStep;
    h+='<div class="step-wrap"><div class="step-dot'+(done?' done':(active?' active':''))+'">'+(done?'&#10003;':steps[i].n)+'</div><div class="step-label'+(done?' done':(active?' active':''))+'">'+steps[i].l+'</div></div>';
    if(i<steps.length-1)h+='<div class="step-line'+(i<activeStep?' done':'')+'"></div>';
  }
  return h+'</div>';
}

function turnoutHTML(round){
  var db=loadDB();if(!db)return '';var studs=db.Students;var total=studs.length;if(!total)return '';
  var voted=0;for(var i=0;i<studs.length;i++){if(round===2?studs[i].voted_round2:studs[i].voted_round1)voted++;}
  var pct=Math.round(voted/total*100);
  return '<div class="turnout-gauge"><span class="text-sm">Turnout</span><div class="gauge-bar-bg"><div class="gauge-bar" style="width:'+pct+'%"></div></div><span class="gauge-pct">'+pct+'%</span></div>';
}

function electionStatusHTML(){
  var db=loadDB();if(!db)return '';var vs=db.VotingSettings;
  var badge='',timer='',extra='';
  if(vs.final_results_declared){badge='<span class="status-badge badge-done">Election Complete</span>';extra='<div style="margin-top:8px;"><button class="btn btn-success btn-sm" onclick="navigate(\'final-results\')">View Final Results</button></div>';}
  else if(vs.semi_results_declared&&vs.current_round!==2){badge='<span class="status-badge badge-open">Semi Results Available</span>';extra='<div style="margin-top:8px;"><button class="btn btn-primary btn-sm" onclick="navigate(\'semi-results\')">View Semi Results</button></div>';}
  else if(vs.status==='Open'){badge='<span class="status-badge badge-open">Round '+vs.current_round+' &#8212; Voting Open</span>';timer='<div class="timer-display" id="timerDisplay"></div>';extra=turnoutHTML(vs.current_round);}
  else if(vs.status==='Closed'){badge='<span class="status-badge badge-closed">Round '+vs.current_round+' &#8212; Voting Closed</span>';}
  else{badge='<span class="status-badge badge-idle">Not Started</span>';}
  return '<div class="glass election-status-home"><h3>Election Status</h3>'+stepperHTML()+badge+timer+extra+'</div>';
}

function checkSID(){
  var sidEl=document.getElementById('srSID');var nf=document.getElementById('srName');if(!sidEl||!nf)return;
  var sid=sidEl.value.trim();hideFieldError('srSIDErr');
  var okEl=document.getElementById('srSIDOk');if(okEl)okEl.classList.remove('show');
  if(sid.length<8){nf.value='';setInputState('srSID','');return;}
  if(!validateSID(sid)){showFieldError('srSIDErr','Must be exactly 8 digits');setInputState('srSID','error');nf.value='';return;}
  var db=loadDB();if(!db)return;
  var entry=null;for(var i=0;i<db.ValidStudentIDs.length;i++){if(db.ValidStudentIDs[i].id===sid){entry=db.ValidStudentIDs[i];break;}}
  if(!entry){showFieldError('srSIDErr','Student ID not found in records');setInputState('srSID','error');nf.value='';return;}
  for(var i=0;i<db.Students.length;i++){if(db.Students[i].student_id===sid){showFieldError('srSIDErr','Already registered');setInputState('srSID','error');nf.value='';return;}}
  nf.value=entry.name;setInputState('srSID','success');
  if(okEl){okEl.textContent='Verified: '+entry.name;okEl.classList.add('show');}
}

  ['srSIDErr','srPassErr','srContactErr','srSecAErr'].forEach(hideFieldError);

function doResetPassword(){
  var sid=(document.getElementById('fpSID')||{}).value||'';sid=sid.trim();
  var secQ=parseInt((document.getElementById('fpSecQ')||{}).value)||0;
  var secA=(document.getElementById('fpSecA')||{}).value||'';secA=secA.trim().toLowerCase();
  var newPass=(document.getElementById('fpNewPass')||{}).value||'';
  var confPass=(document.getElementById('fpConfPass')||{}).value||'';
  var ok=true;
  ['fpSIDErr','fpSecAErr','fpNewPassErr','fpConfPassErr'].forEach(hideFieldError);
  if(!validateSID(sid)){showFieldError('fpSIDErr','Must be 8 digits');ok=false;}
  if(!secA){showFieldError('fpSecAErr','Answer required');ok=false;}
  if(!validatePassword(newPass)){showFieldError('fpNewPassErr','Min 4 characters');ok=false;}
  if(newPass!==confPass){showFieldError('fpConfPassErr','Passwords do not match');ok=false;}
  if(!ok)return;
  var db=loadDB();if(!db)return;
  var stu=null;for(var i=0;i<db.Students.length;i++){if(db.Students[i].student_id===sid){stu=db.Students[i];break;}}
  if(!stu){showFieldError('fpSIDErr','Student ID not found');return;}
  if(!stu.security_answer_hash){toast('No security question set. Contact admin.','error');return;}
  if(stu.security_question!==secQ||stu.security_answer_hash!==hashPw(secA)){showFieldError('fpSecAErr','Security question or answer is incorrect');toast('Verification failed','error');return;}
  stu.password_hash=hashPw(newPass);saveDB(db);addLog('Password reset: '+stu.name);
  navigate('student-login');toast('Password reset successfully! Please login.','success');
}

    content='<div class="glass" style="padding:22px;"><h3 class="section-head">Candidate Requests ('+reqs.length+')</h3>'+reqHTML+'</div>';
  }
  else if(adminTab==='students'){
    var rows='';
    for(var i=0;i<studs.length;i++){var st=studs[i];rows+='<tr class="student-row" data-search="'+esc((st.name+' '+st.student_id).toLowerCase())+'"><td>'+(i+1)+'</td><td>'+esc(st.name)+'</td><td>'+esc(st.student_id)+'</td><td>+91-'+esc(st.contact_no)+'</td><td>'+(st.voted_round1?'<span class="glow-green">Yes</span>':'-')+'</td><td>'+(st.voted_round2?'<span class="glow-green">Yes</span>':'-')+'</td><td style="display:flex;gap:4px;"><button class="btn btn-warning btn-xs" onclick="showConfirm(\'Reset Password\',\'Reset password for '+esc(st.name)+' to 1234?\',function(){resetStudentPassword(\''+st.id+'\')})">Rst</button><button class="btn btn-danger btn-xs" onclick="showConfirm(\'Delete\',\'Delete this student?\',function(){deleteStudent(\''+st.id+'\')})">Del</button></td></tr>';}
    if(!studs.length)rows='<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">&#128100;</div><div class="empty-text">No students</div></div></td></tr>';
    content='<div class="glass" style="padding:22px;"><h3 class="section-head">Students ('+studs.length+')</h3><div class="search-box"><input type="text" id="studentSearch" placeholder="Search..." oninput="filterStudentTable()"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Name</th><th>ID</th><th>Contact</th><th>R1</th><th>R2</th><th>Actions</th></tr></thead><tbody id="studentTableBody">'+rows+'</tbody></table></div></div>';
  }
  else if(adminTab==='validids'){
    var tags='';for(var j=0;j<vids.length;j++){var v=vids[j];tags+='<span class="id-tag" data-search="'+esc((v.id+' '+v.name).toLowerCase())+'">'+esc(v.id)+' <span class="id-tag-name">'+esc(v.name)+'</span><button class="id-tag-x" onclick="showConfirm(\'Remove\',\'Remove this ID?\',function(){removeValidID(\''+esc(v.id)+'\')})">x</button></span>';}
    if(!vids.length)tags='<div class="empty-state"><div class="empty-icon">&#127380;</div><div class="empty-text">No valid IDs</div></div>';
    content='<div class="glass" style="padding:22px;margin-bottom:16px;"><h3 class="section-head">Add Valid Student ID</h3><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;"><input type="text" class="input-glass" id="addVID" placeholder="Student ID" style="width:140px;" maxlength="8"><input type="text" class="input-glass" id="addVName" placeholder="Student Name" style="flex:1;min-width:140px;"><button class="btn btn-primary btn-sm" onclick="addValidID()">Add</button></div><div class="field-error" id="vidErr" style="margin-top:5px;"></div><div style="margin-top:12px;"><label class="text-sm">Bulk Add (ID:Name, comma separated)</label><input type="text" class="input-glass" id="bulkVIDs" placeholder="24060356:John, 24060357:Jane" style="margin-top:4px;"><button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="bulkAddIDs()">Bulk Add</button></div></div><div class="glass" style="padding:22px;"><h3 class="section-head">Valid IDs ('+vids.length+')</h3><div class="search-box"><input type="text" id="vidSearch" placeholder="Search..." oninput="filterVIDs()"></div><div class="id-tags" id="vidTags">'+tags+'</div></div>';
  }
  else if(adminTab==='currentcr'){
    var cr=db.CurrentCR;if(!window._photoData)window._photoData={};
    var detailTags='';if(cr.profile_details&&cr.profile_details.length){for(var i=0;i<cr.profile_details.length;i++){var d=cr.profile_details[i];detailTags+='<span class="cr-detail-item">'+esc(d.category)+': '+esc(d.value)+' <button class="id-tag-x" onclick="showConfirm(\'Remove\',\'Remove?\',function(){removeCRDetail('+i+')})">x</button></span>';}}
    content='<div class="glass" style="padding:22px;"><h3 class="section-head">Current CR Profile</h3>'+
    '<div class="input-group"><label>CR Name</label><input type="text" class="input-glass" id="crName" value="'+esc(cr.name)+'"></div>'+
    '<div class="input-group"><label>Contact No</label><div class="contact-row"><span class="contact-prefix">+91-</span><input type="text" class="input-glass" id="crContact" value="'+esc(cr.contact_no)+'" maxlength="10"></div></div>'+
    '<div class="input-group"><label>About</label><textarea class="input-glass" id="crAbout" rows="3" placeholder="About the CR...">'+esc(cr.about||'')+'</textarea></div>'+
    '<div class="input-group"><label>CR Photo</label><div class="photo-upload-area" onclick="document.getElementById(\'crPhotoIn\').click()"><div class="photo-upload-preview" id="crPhotoP">'+(cr.photo?'<img src="'+esc(cr.photo)+'">':'&#128247;')+'</div><div class="photo-upload-text"><strong>Upload Photo</strong></div></div><input type="file" id="crPhotoIn" class="photo-upload-input" accept="image/*" onchange="handlePhotoUpload(\'crPhotoIn\',\'crPhotoP\')"></div>'+
    '<div style="margin-bottom:14px;"><label style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-bottom:4px;display:block;">Profile Details</label><div style="margin-bottom:6px;">'+detailTags+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;"><select class="input-glass" id="crDCat" style="width:auto;padding:7px 10px;font-size:0.8rem;">'+DETAIL_OPTIONS.map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join('')+'</select><input type="text" class="input-glass" id="crDVal" placeholder="Value" style="flex:1;min-width:120px;"><button class="btn btn-secondary btn-xs" onclick="addCRDetail()">+ Add</button></div></div>'+
    '<button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="showConfirm(\'Update CR\',\'Save changes?\',updateCR)">Update CR</button></div>';
  }
  else if(adminTab==='logs'){
    var logs=getLogs();var logHTML='';
    if(logs.length){for(var i=0;i<logs.length;i++){var l=logs[i];var d=new Date(l.time);logHTML+='<div class="log-item"><span class="log-time">'+d.toLocaleTimeString()+'</span><span class="log-msg">'+esc(l.msg)+'</span></div>';}}
    else logHTML='<div class="empty-state"><div class="empty-icon">&#128196;</div><div class="empty-text">No activity</div></div>';
    content='<div class="glass" style="padding:22px;"><h3 class="section-head">Activity Log</h3><div class="activity-log">'+logHTML+'</div></div>';
  }
  else if(adminTab==='settings'){
    content='<div class="glass" style="padding:22px;"><h3 class="section-head">Settings</h3><div class="input-group"><label>Qualification Limit (Top N for Round 2)</label><div style="display:flex;gap:8px;align-items:center;"><input type="number" class="input-glass" id="qualLimit" min="2" max="20" value="'+vs.qualification_limit+'" style="width:100px;"><button class="btn btn-primary btn-sm" onclick="updateQualLimit()">Update</button></div></div><div style="margin-top:16px;border-top:1px solid rgba(255,255,255,0.06);padding-top:16px;"><h4 style="font-size:0.85rem;margin-bottom:6px;">Change Unlock PIN</h4><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><input type="password" class="input-glass" id="newUPin" placeholder="New PIN" maxlength="6" style="width:160px;"><button class="btn btn-danger btn-sm" onclick="showConfirm(\'Change PIN\',\'Change unlock PIN?\',changeUnlockPin)">Change</button></div></div><div style="margin-top:16px;border-top:1px solid rgba(255,255,255,0.06);padding-top:16px;"><h4 style="font-size:0.85rem;margin-bottom:10px;">Export Database</h4><button class="btn btn-success btn-sm" onclick="exportDatabase()">&#11015; Export as JSON</button><p class="text-sm" style="margin-top:6px;">Downloads all data as a JSON file</p></div></div>';
  }

  return '<div class="container fade-in"><div class="dash-header"><div><h2 class="section-title">Admin Dashboard</h2><p class="welcome-text" style="font-size:0.95rem;">Welcome, <span class="welcome-name">'+esc(s.name)+'</span></p></div></div>'+stats+tabHTML+content+'</div>';
}

/* ADMIN HELPERS */
function filterStudentTable(){var el=document.getElementById('studentSearch');if(!el)return;var q=el.value.toLowerCase();var rows=document.querySelectorAll('.student-row');for(var i=0;i<rows.length;i++){rows[i].style.display=(rows[i].getAttribute('data-search')||'').indexOf(q)>=0?'':'none';}}
function filterVIDs(){var el=document.getElementById('vidSearch');if(!el)return;var q=el.value.toLowerCase();var tags=document.querySelectorAll('#vidTags .id-tag');for(var i=0;i<tags.length;i++){tags[i].style.display=(tags[i].getAttribute('data-search')||'').indexOf(q)>=0?'':'none';}}
function checkCandSID(){var sidEl=document.getElementById('candSID');var nf=document.getElementById('candName');if(!sidEl||!nf)return;var sid=sidEl.value.trim();hideFieldError('candErr');if(sid.length<8){nf.value='';return;}if(!validateSID(sid)){showFieldError('candErr','Must be 8 digits');nf.value='';return;}var db=loadDB();if(!db)return;var entry=null;for(var i=0;i<db.ValidStudentIDs.length;i++){if(db.ValidStudentIDs[i].id===sid){entry=db.ValidStudentIDs[i];break;}}if(!entry){showFieldError('candErr','Not in valid IDs');nf.value='';return;}for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].student_id===sid){showFieldError('candErr','Already a candidate');nf.value='';return;}}nf.value=entry.name;}

function addCandidate(){var sidEl=document.getElementById('candSID');var nameEl=document.getElementById('candName');var bioEl=document.getElementById('candBio');if(!sidEl||!nameEl)return;var sid=sidEl.value.trim(),name=nameEl.value.trim(),bio=bioEl?bioEl.value:'';hideFieldError('candErr');if(!validateSID(sid)||!name){showFieldError('candErr','Enter valid Student ID');return;}var db=loadDB();if(!db)return;for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].student_id===sid){showFieldError('candErr','Already a candidate');return;}}db.Candidates.push({id:uid(),name:name,student_id:sid,round1_votes:0,round2_votes:0,qualified_for_final:false,bio:bio});saveDB(db);addLog('Candidate added: '+name);navigate('admin-dashboard',{tab:'candidates'});toast('Candidate added!','success');}
function deleteCandidate(cid){var db=loadDB();if(!db)return;db.Candidates=db.Candidates.filter(function(x){return x.id!==cid;});saveDB(db);addLog('Candidate deleted');navigate('admin-dashboard',{tab:'candidates'});toast('Deleted','info');}
function deleteStudent(sid){var db=loadDB();if(!db)return;db.Students=db.Students.filter(function(x){return x.id!==sid;});saveDB(db);addLog('Student deleted');navigate('admin-dashboard',{tab:'students'});toast('Student deleted','info');}
function resetStudentPassword(sid){var db=loadDB();if(!db)return;var stu=null;for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===sid){stu=db.Students[i];break;}}if(!stu){toast('Student not found','error');return;}stu.password_hash=hashPw('1234');saveDB(db);addLog('Password reset: '+stu.name);toast('Password reset to: 1234','success');}
function addValidID(){var vidEl=document.getElementById('addVID');var vnameEl=document.getElementById('addVName');if(!vidEl||!vnameEl)return;var vid=vidEl.value.trim(),vname=vnameEl.value.trim();hideFieldError('vidErr');if(!validateSID(vid)){showFieldError('vidErr','Must be 8 digits');return;}if(!vname){showFieldError('vidErr','Name required');return;}var db=loadDB();if(!db)return;for(var i=0;i<db.ValidStudentIDs.length;i++){if(db.ValidStudentIDs[i].id===vid){showFieldError('vidErr','Already exists');return;}}db.ValidStudentIDs.push({id:vid,name:vname});saveDB(db);addLog('ID added: '+vid);navigate('admin-dashboard',{tab:'validids'});toast('Added','success');}
function bulkAddIDs(){var rawEl=document.getElementById('bulkVIDs');if(!rawEl)return;var entries=rawEl.value.split(',');var db=loadDB();if(!db)return;var added=0;for(var i=0;i<entries.length;i++){var s=entries[i].trim();if(!s)continue;var parts=s.split(':');if(parts.length===2){var id=parts[0].trim(),name=parts[1].trim();if(validateSID(id)&&name){var exists=false;for(var j=0;j<db.ValidStudentIDs.length;j++){if(db.ValidStudentIDs[j].id===id){exists=true;break;}}if(!exists){db.ValidStudentIDs.push({id:id,name:name});added++;}}}}saveDB(db);addLog(added+' IDs bulk added');navigate('admin-dashboard',{tab:'validids'});toast(added+' added','success');}
function removeValidID(vid){var db=loadDB();if(!db)return;db.ValidStudentIDs=db.ValidStudentIDs.filter(function(v){return v.id!==vid;});saveDB(db);navigate('admin-dashboard',{tab:'validids'});toast('Removed','info');}
function updateQualLimit(){var el=document.getElementById('qualLimit');if(!el)return;var v=parseInt(el.value);if(isNaN(v)||v<2||v>20){toast('Must be 2-20','error');return;}var db=loadDB();if(!db)return;db.VotingSettings.qualification_limit=v;saveDB(db);toast('Updated to '+v,'success');}
function changeUnlockPin(){var el=document.getElementById('newUPin');if(!el)return;var pin=el.value.trim();if(!validatePin(pin)){toast('Must be 4-6 digits','error');return;}var db=loadDB();if(!db)return;db.AdminUnlockPin=hashPw(pin);saveDB(db);toast('PIN changed!','success');}

function updateCR(){var db=loadDB();if(!db)return;var nameEl=document.getElementById('crName');var contactEl=document.getElementById('crContact');var aboutEl=document.getElementById('crAbout');if(nameEl)db.CurrentCR.name=nameEl.value.trim()||db.CurrentCR.name;var contact=contactEl?contactEl.value.trim():'';if(contact&&!validateContact(contact)){toast('Contact must be 10 digits','error');return;}db.CurrentCR.contact_no=contact;if(aboutEl)db.CurrentCR.about=aboutEl.value.trim();var photo=(window._photoData&&window._photoData['crPhotoIn'])||null;if(photo)db.CurrentCR.photo=photo;saveDB(db);navigate('admin-dashboard',{tab:'currentcr'});toast('CR updated','success');}
function addCRDetail(){var catEl=document.getElementById('crDCat');var valEl=document.getElementById('crDVal');if(!catEl||!valEl)return;var cat=catEl.value,val=valEl.value.trim();if(!val){toast('Enter a value','error');return;}var db=loadDB();if(!db)return;if(!db.CurrentCR.profile_details)db.CurrentCR.profile_details=[];db.CurrentCR.profile_details.push({category:cat,value:val});saveDB(db);navigate('admin-dashboard',{tab:'currentcr'});toast('Detail added','success');}
function removeCRDetail(idx){var db=loadDB();if(!db)return;if(db.CurrentCR.profile_details)db.CurrentCR.profile_details.splice(idx,1);saveDB(db);navigate('admin-dashboard',{tab:'currentcr'});toast('Removed','info');}

function approveRequest(reqId){var db=loadDB();if(!db)return;var req=null;for(var i=0;i<db.CandidateRequests.length;i++){if(db.CandidateRequests[i].id===reqId){req=db.CandidateRequests[i];break;}}if(!req)return;var stu=null;for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===req.student_id){stu=db.Students[i];break;}}if(!stu){toast('Student not found','error');return;}var exists=false;for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].student_id===stu.student_id){exists=true;break;}}if(!exists){db.Candidates.push({id:uid(),name:stu.name,student_id:stu.student_id,round1_votes:0,round2_votes:0,qualified_for_final:false,bio:req.message||''});}db.CandidateRequests=db.CandidateRequests.filter(function(r){return r.id!==reqId;});saveDB(db);addLog('Approved candidate: '+stu.name);navigate('admin-dashboard',{tab:'requests'});toast('Approved '+stu.name,'success');}
function rejectRequest(reqId){var db=loadDB();if(!db)return;db.CandidateRequests=db.CandidateRequests.filter(function(r){return r.id!==reqId;});saveDB(db);navigate('admin-dashboard',{tab:'requests'});toast('Request rejected','info');}

function adminAction(action){
  var db=loadDB();if(!db)return;var vs=db.VotingSettings;
  var dur=(action==='start_r1'||action==='start_r2')?getTimerSeconds():null;
  if(action==='start_r1'){
    if(!db.Candidates.length){toast('Add candidates first','error');return;}
    vs.current_round=1;vs.status='Open';vs.semi_results_declared=false;vs.final_results_declared=false;vs.round_start_time=Date.now();vs.round_duration=dur;
    for(var i=0;i<db.Students.length;i++){db.Students[i].voted_round1=false;db.Students[i].voted_round2=false;}
    for(var i=0;i<db.Candidates.length;i++){db.Candidates[i].round1_votes=0;db.Candidates[i].round2_votes=0;db.Candidates[i].qualified_for_final=false;}
    saveDB(db);addLog('Round 1 started');navigate('admin-dashboard',{tab:'election'});toast('Round 1 started!','success');
  }else if(action==='close_r1'){if(vs.current_round!==1||vs.status!=='Open'){toast('Round 1 not open','error');return;}vs.status='Closed';vs.round_start_time=null;vs.round_duration=null;saveDB(db);addLog('Round 1 closed');navigate('admin-dashboard',{tab:'election'});toast('Round 1 closed','info');
  }else if(action==='declare_semi'){
    if(vs.current_round!==1||vs.status!=='Closed'){toast('Close Round 1 first','error');return;}
    var sorted=db.Candidates.slice().sort(function(a,b){return b.round1_votes-a.round1_votes;});
    for(var i=0;i<sorted.length;i++){for(var j=0;j<db.Candidates.length;j++){if(db.Candidates[j].id===sorted[i].id){db.Candidates[j].qualified_for_final=i<vs.qualification_limit;break;}}}
    vs.semi_results_declared=true;saveDB(db);addLog('Semi declared');navigate('admin-dashboard',{tab:'election'});toast('Semi results declared!','success');
  }else if(action==='start_r2'){
    if(!vs.semi_results_declared){toast('Declare semi first','error');return;}
    vs.current_round=2;vs.status='Open';vs.round_start_time=Date.now();vs.round_duration=dur;
    for(var i=0;i<db.Students.length;i++){db.Students[i].voted_round2=false;}
    for(var i=0;i<db.Candidates.length;i++){db.Candidates[i].round2_votes=0;}
    saveDB(db);addLog('Round 2 started');navigate('admin-dashboard',{tab:'election'});toast('Round 2 started!','success');
  }else if(action==='close_r2'){if(vs.current_round!==2||vs.status!=='Open'){toast('Round 2 not open','error');return;}vs.status='Closed';vs.round_start_time=null;vs.round_duration=null;saveDB(db);addLog('Round 2 closed');navigate('admin-dashboard',{tab:'election'});toast('Round 2 closed','info');
  }else if(action==='declare_final'){
    if(vs.current_round!==2||vs.status!=='Closed'){toast('Close Round 2 first','error');return;}
    vs.final_results_declared=true;
    var finalists=db.Candidates.filter(function(c){return c.qualified_for_final;}).sort(function(a,b){return b.round2_votes-a.round2_votes;});
    if(finalists.length){db.CurrentCR.name=finalists[0].name;db.CurrentCR.about='Elected via NextCR';var stu=null;for(var j=0;j<db.Students.length;j++){if(db.Students[j].student_id===finalists[0].student_id){stu=db.Students[j];break;}}if(stu&&stu.photo)db.CurrentCR.photo=stu.photo;}
    saveDB(db);addLog('Final declared');navigate('admin-dashboard',{tab:'election'});toast('Final results declared!','success');
  }else if(action==='reset'){
    for(var i=0;i<db.Students.length;i++){db.Students[i].voted_round1=false;db.Students[i].voted_round2=false;}
    db.Candidates=[];db.CandidateRequests=[];vs.current_round=0;vs.status='NotStarted';vs.semi_results_declared=false;vs.final_results_declared=false;vs.round_start_time=null;vs.round_duration=null;
    saveDB(db);addLog('Election reset');navigate('admin-dashboard',{tab:'election'});toast('Election reset','info');
  }
}

function exportDatabase(){var db=loadDB();if(!db){toast('No data','error');return;}var str=JSON.stringify(db,null,2);var blob=new Blob([str],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='nextcr_db_'+new Date().toISOString().split('T')[0]+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);toast('Database exported!','success');}

/* ===== STUDENT DASHBOARD ===== */
function pageStudentDashboard(s){
  if(!s||s.role!=='student'){navigate('home');return '';}
  var db=loadDB();if(!db)return '';var vs=db.VotingSettings;
  var stu=null;for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===s.user_id){stu=db.Students[i];break;}}
  if(!stu){clearSession();navigate('home');toast('Session expired','error');return '';}
  var actionsHTML='';
  if(vs.final_results_declared){actionsHTML='<button class="btn btn-success" onclick="navigate(\'final-results\')">View Final Results</button>';}
  else if(vs.current_round===2&&vs.status==='Open'){if(!stu.voted_round2)actionsHTML='<button class="btn btn-success btn-lg" onclick="navigate(\'voting-round2\')">Vote Now (Round 2)</button>';else actionsHTML='<div class="glass" style="padding:14px 20px;text-align:center;border-color:rgba(0,255,135,0.15);"><span class="glow-green">&#10003; Already voted in Round 2</span></div>';}
  else if(vs.semi_results_declared&&vs.current_round!==2){actionsHTML='<button class="btn btn-primary" onclick="navigate(\'semi-results\')">View Semi Results</button>';}
  else if(vs.current_round===1&&vs.status==='Open'){if(!stu.voted_round1)actionsHTML='<button class="btn btn-success btn-lg" onclick="navigate(\'voting-round1\')">Vote Now (Round 1)</button>';else actionsHTML='<div class="glass" style="padding:14px 20px;text-align:center;border-color:rgba(0,255,135,0.15);"><span class="glow-green">&#10003; Already voted in Round 1</span></div>';}

  var isCandidate=false,hasPendingRequest=false;
  for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].student_id===stu.student_id){isCandidate=true;break;}}
  for(var i=0;i<(db.CandidateRequests||[]).length;i++){if(db.CandidateRequests[i].student_id===stu.id){hasPendingRequest=true;break;}}

  var menuItems='<div class="student-menu-grid">';
  menuItems+='<div class="glass student-menu-item" onclick="navigate(\'profile\')"><div class="student-menu-icon">&#128100;</div><div class="student-menu-label">My Profile</div></div>';
  menuItems+='<div class="glass student-menu-item" onclick="navigate(\'chat\')"><div class="student-menu-icon">&#128172;</div><div class="student-menu-label">Class Chat</div></div>';
  if(!isCandidate&&!hasPendingRequest&&vs.status!=='NotStarted'&&!vs.final_results_declared){menuItems+='<div class="glass student-menu-item" onclick="navigate(\'request-candidacy\')"><div class="student-menu-icon">&#127942;</div><div class="student-menu-label">Become CR Candidate</div></div>';}

    var canEdit=isMine&&!isDeleted&&(Date.now()-msg.time<30000);
    var actions='';
    if(isMine&&!isDeleted){actions='<div class="chat-msg-actions">';if(canEdit)actions+='<button class="chat-msg-act-btn" onclick="startEditChat(\''+msg.id+'\')">Edit</button>';actions+='<button class="chat-msg-act-btn" onclick="showConfirm(\'Delete\',\'Delete for everyone?\',function(){deleteChatForAll(\''+msg.id+'\')})">Del All</button><button class="chat-msg-act-btn" onclick="deleteChatForMe(\''+msg.id+'\')">Del Me</button></div>';}
    else if(!isDeleted){actions='<div class="chat-msg-actions"><button class="chat-msg-act-btn" onclick="deleteChatForMe(\''+msg.id+'\')">Del Me</button></div>';}
    var isPrivateMsg=msg.privateTo&&msg.privateTo!=='all';
    var time=new Date(msg.time);var timeStr=time.getHours()+':'+('0'+time.getMinutes()).slice(-2);
    var ticks=isMine?'<span class="chat-msg-ticks read">&#10003;&#10003;</span>':'';
    msgsHTML+='<div class="chat-msg '+(isMine?'chat-msg-mine':'chat-msg-other')+(isPrivateMsg?' chat-msg-private':'')+'" id="chatmsg_'+msg.id+'">'+privateLabel+'<div class="chat-msg-name">'+(isMine?'You':esc(displayName))+'</div>'+textContent+'<div class="chat-msg-time">'+timeStr+ticks+'</div>'+actions+'</div>';
  }
  if(!chats.length)msgsHTML='<div class="empty-state"><div class="empty-icon">&#128172;</div><div class="empty-text">No messages yet. Start chatting!</div></div>';
  var editBar=chatEditId?'<div class="chat-edit-bar"><span>Editing message</span><button onclick="cancelEditChat()">Cancel</button></div>':'';
  var attachPreview=window._chatMedia?'<div class="chat-media-attach"><img src="'+window._chatMedia+'"><button onclick="window._chatMedia=null;navigate(\'chat\')">&#10005; Remove</button></div>':'';
  return '<div class="container fade-in">'+backBtn()+'<h2 class="section-title">Class Chat</h2><div class="glass chat-container"><div class="chat-header"><select class="chat-user-select" onchange="chatTarget=this.value;navigate(\'chat\')">'+userOpts+'</select><span class="text-sm">'+(chatTarget==='all'?'Public Chat':'Private')+'</span></div><div class="chat-messages" id="chatMessages">'+msgsHTML+'</div>'+editBar+attachPreview+'<div class="chat-input-area"><button class="chat-media-btn" onclick="document.getElementById(\'chatMediaIn\').click()" title="Send image">&#128247;</button><input type="file" id="chatMediaIn" class="photo-upload-input" accept="image/*,video/*" onchange="handleChatMedia()"><textarea class="input-glass" id="chatInput" rows="1" placeholder="Type a message..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea><button class="chat-send-btn" onclick="sendChat()">&#10148;</button></div></div></div>';
}
function scrollChatBottom(){var el=document.getElementById('chatMessages');if(el)el.scrollTop=el.scrollHeight;}
function sendChat(){var s=getSession();if(!s)return;var inputEl=document.getElementById('chatInput');if(!inputEl)return;var text=inputEl.value.trim();var mediaData=window._chatMedia||null;if(!text&&!mediaData)return;var chats=loadChats();if(chatEditId){for(var i=0;i<chats.length;i++){if(chats[i].id===chatEditId&&chats[i].userId===s.user_id){if(Date.now()-chats[i].time>30000){toast('Edit time expired (30s)','error');cancelEditChat();return;}chats[i].text=text;chats[i].edited=true;break;}}chatEditId=null;}else{chats.push({id:uid(),userId:s.user_id,userName:s.name,userRole:s.role,text:text,media:mediaData||'',time:Date.now(),edited:false,deletedForAll:false,deletedFor:[],privateTo:chatTarget||'all'});}saveChats(chats);window._chatMedia=null;navigate('chat');}
function handleChatMedia(){var input=document.getElementById('chatMediaIn');if(!input||!input.files||!input.files[0])return;var file=input.files[0];if(file.size>5*1024*1024){toast('Max 5MB','error');return;}var r=new FileReader();r.onload=function(e){window._chatMedia=e.target.result;navigate('chat');};r.readAsDataURL(file);}
function previewChatImage(src){var overlay=document.createElement('div');overlay.className='chat-media-preview';overlay.innerHTML='<button class="chat-media-preview-close" onclick="this.parentNode.remove()">&#10005;</button><img src="'+src+'">';overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};document.body.appendChild(overlay);}
function startEditChat(msgId){var s=getSession();if(!s)return;var chats=loadChats();var msg=null;for(var i=0;i<chats.length;i++){if(chats[i].id===msgId){msg=chats[i];break;}}if(!msg||msg.userId!==s.user_id)return;if(Date.now()-msg.time>30000){toast('Edit time expired (30s)','error');return;}chatEditId=msgId;navigate('chat');setTimeout(function(){var el=document.getElementById('chatInput');if(el){el.value=msg.text;el.focus();}},100);}
function cancelEditChat(){chatEditId=null;navigate('chat');}
function deleteChatForAll(msgId){var chats=loadChats();for(var i=0;i<chats.length;i++){if(chats[i].id===msgId){chats[i].deletedForAll=true;chats[i].text='';chats[i].media='';break;}}saveChats(chats);navigate('chat');toast('Deleted for everyone','info');}
function deleteChatForMe(msgId){var s=getSession();if(!s)return;var chats=loadChats();for(var i=0;i<chats.length;i++){if(chats[i].id===msgId){if(!chats[i].deletedFor)chats[i].deletedFor=[];chats[i].deletedFor.push(s.user_id);break;}}saveChats(chats);navigate('chat');toast('Deleted for you','info');}

/* ===== CONFETTI ===== */
function launchConfetti(type){var canvas=document.getElementById('celebCanvas');if(!canvas)return;var ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;var particles=[];var colors=type==='final'?['#00ff87','#00d4ff','#ffd700','#ff6b81','#b44aff','#fff']:['#00ff87','#00d4ff','#b44aff','#ffd700'];var count=type==='final'?180:100;var duration=type==='final'?6000:4000;for(var i=0;i<count;i++){var angle=Math.random()*Math.PI*2;var speed=Math.random()*7+3;particles.push({x:canvas.width*(0.2+Math.random()*0.6),y:canvas.height*(0.2+Math.random()*0.3),vx:Math.cos(angle)*speed*(Math.random()*2-1),vy:Math.sin(angle)*speed*-1-Math.random()*3,color:colors[Math.floor(Math.random()*colors.length)],size:Math.random()*5+2,rotation:Math.random()*360,rotSpeed:(Math.random()-0.5)*10,opacity:1,decay:0.005+Math.random()*0.007});}var startTime=Date.now();(function animate(){if(Date.now()-startTime>duration){ctx.clearRect(0,0,canvas.width,canvas.height);return;}ctx.clearRect(0,0,canvas.width,canvas.height);for(var i=0;i<particles.length;i++){var p=particles[i];if(p.opacity<=0)continue;p.x+=p.vx;p.vy+=0.1;p.y+=p.vy;p.vx*=0.99;p.rotation+=p.rotSpeed;p.opacity-=p.decay;if(p.opacity<0)p.opacity=0;ctx.save();ctx.globalAlpha=p.opacity;ctx.translate(p.x,p.y);ctx.rotate(p.rotation*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size*1.5/2,p.size,p.size*1.5);ctx.restore();}requestAnimationFrame(animate);})();}

/* ===== SNOW ===== */
function initSnow(){var c=document.getElementById('snowfall');if(!c)return;for(var i=0;i<35;i++){var f=document.createElement('div');f.className='snowflake';var sz=Math.random()*3+1;f.style.width=sz+'px';f.style.height=sz+'px';f.style.left=Math.random()*100+'%';f.style.animationDuration=(Math.random()*8+8)+'s';f.style.animationDelay=(Math.random()*12)+'s';f.style.opacity=Math.random()*0.4+0.1;c.appendChild(f);}}

function startApp(){
  var session=getSession();var saved=loadSavedPage();
  if(session&&saved&&saved.page){
    currentPage=saved.page;if(saved.tab)adminTab=saved.tab;
    if((currentPage==='admin-dashboard'||currentPage==='admin-unlock')&&(!session||session.role!=='admin'))currentPage='home';
    else if(currentPage==='admin-dashboard'&&!session.unlocked)currentPage='admin-unlock';
    if((currentPage==='student-dashboard'||currentPage.indexOf('voting')===0)&&(!session||session.role!=='student'))currentPage='home';
    if(currentPage==='profile'&&!session)currentPage='home';
  }else{currentPage='home';}
  render();startTimer();
  if(!_serverSync)toast('Server offline \u2014 data saved locally','warning');
}
