else if(adminTab==='candidates'){content='<div class="glass" style="padding:24px;margin-bottom:18px;"><h3 class="section-head">Add Candidate</h3><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;"><input type="text" class="input-glass" id="candSID" placeholder="Student ID" style="width:160px;" maxlength="8" oninput="checkCandSID()"><input type="text" class="input-glass" id="candName" placeholder="Auto-filled" style="width:180px;" readonly><input type="text" class="input-glass" id="candBio" placeholder="Bio (optional)" style="flex:1;min-width:150px;"><button class="btn btn-primary btn-sm" onclick="addCandidate()">Add</button></div><div class="field-error" id="candErr" style="margin-top:6px;"></div><div class="field-success" id="candOk" style="margin-top:6px;"></div></div>';var rows='';for(var i=0;i<cands.length;i++){var c=cands[i];var q=c.qualified_for_final?'<span class="glow-green">Qualified</span>':'-';var safeName=esc(c.name).replace(/'/g,'');rows+='<tr><td>'+(i+1)+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.student_id)+'</td><td>'+c.round1_votes+'</td><td>'+c.round2_votes+'</td><td>'+q+'</td><td><button class="btn btn-danger btn-xs" onclick="showConfirm(\'Delete\',\'Remove '+safeName+'?\',function(){deleteCandidate(\''+c.id+'\')})">Del</button></td></tr>';}if(!cands.length)rows='<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">&#128101;</div><div class="empty-text">No candidates yet</div></div></td></tr>';content+='<div class="glass" style="padding:24px;"><h3 class="section-head">Candidates ('+cands.length+')</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Name</th><th>ID</th><th>R1</th><th>R2</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';}
else if(adminTab==='students'){var searchH='<div class="search-box"><input type="text" id="studentSearch" placeholder="Search students..." oninput="filterStudentTable()"></div>';var rows='';for(var i=0;i<studs.length;i++){var st=studs[i];rows+='<tr class="student-row" data-search="'+esc((st.name+' '+st.student_id).toLowerCase())+'"><td>'+(i+1)+'</td><td>'+esc(st.name)+'</td><td>'+esc(st.student_id)+'</td><td>+91-'+esc(st.contact_no)+'</td><td>'+(st.voted_round1?'<span class="glow-green">Yes</span>':'-')+'</td><td>'+(st.voted_round2?'<span class="glow-green">Yes</span>':'-')+'</td></tr>';}if(!studs.length)rows='<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">&#128100;</div><div class="empty-text">No students</div></div></td></tr>';content='<div class="glass" style="padding:24px;"><h3 class="section-head">Students ('+studs.length+')</h3>'+searchH+'<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Name</th><th>ID</th><th>Contact</th><th>R1</th><th>R2</th></tr></thead><tbody id="studentTableBody">'+rows+'</tbody></table></div></div>';}
else if(adminTab==='validids'){var searchH='<div class="search-box"><input type="text" id="vidSearch" placeholder="Search IDs..." oninput="filterVIDs()"></div>';var tags='';for(var j=0;j<vids.length;j++){var v=vids[j];tags+='<span class="id-tag" data-search="'+esc((v.id+' '+v.name).toLowerCase())+'">'+esc(v.id)+' <span class="id-tag-name">'+esc(v.name)+'</span><button class="id-tag-x" onclick="showConfirm(\'Remove\',\'Remove '+esc(v.id)+'?\',function(){removeValidID(\''+esc(v.id)+'\')})">x</button></span>';}if(!vids.length)tags='<div class="empty-state"><div class="empty-icon">&#127380;</div><div class="empty-text">No valid IDs</div></div>';content='<div class="glass" style="padding:24px;margin-bottom:18px;"><h3 class="section-head">Add Valid Student ID</h3><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;"><input type="text" class="input-glass" id="addVID" placeholder="Student ID" style="width:160px;" maxlength="8"><input type="text" class="input-glass" id="addVName" placeholder="Student Name" style="flex:1;min-width:160px;"><button class="btn btn-primary btn-sm" onclick="addValidID()">Add</button></div><div class="field-error" id="vidErr" style="margin-top:6px;"></div><div style="margin-top:14px;"><label class="text-sm">Bulk Add (ID:Name, comma separated)</label><input type="text" class="input-glass" id="bulkVIDs" placeholder="24060356:John, 24060357:Jane" style="margin-top:5px;"><button class="btn btn-secondary btn-sm" style="margin-top:8px;" onclick="bulkAddIDs()">Bulk Add</button></div></div><div class="glass" style="padding:24px;"><h3 class="section-head">Valid IDs ('+vids.length+')</h3>'+searchH+'<div class="id-tags" id="vidTags">'+tags+'</div></div>';}
else if(adminTab==='currentcr'){var cr=db.CurrentCR;window._photoData={};var crDetailTags='';if(cr.profile_details&&cr.profile_details.length){for(var i=0;i<cr.profile_details.length;i++){var d=cr.profile_details[i];crDetailTags+='<span class="detail-tag">'+esc(d.category)+': '+esc(d.value)+'<button class="detail-tag-x" onclick="removeCRDetail('+i+')">x</button></span>';}}content='<div class="glass" style="padding:24px;"><h3 class="section-head">Current CR Profile</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div class="input-group"><label>CR Name</label><input type="text" class="input-glass" id="crName" value="'+esc(cr.name)+'"></div><div class="input-group"><label>Contact No</label><div class="contact-row"><span class="contact-prefix">+91-</span><input type="text" class="input-glass" id="crContact" value="'+esc(cr.contact_no)+'" maxlength="10"></div></div></div><div class="input-group"><label>Details</label><input type="text" class="input-glass" id="crDetails" value="'+esc(cr.details)+'"></div><div class="input-group"><label>CR Photo</label><div class="photo-upload-area" onclick="document.getElementById(\'crPhotoIn\').click()"><div class="photo-upload-preview" id="crPhotoP">'+(cr.photo?'<img src="'+esc(cr.photo)+'">':'&#128247;')+'</div><div class="photo-upload-text"><strong>Upload Photo</strong><br>JPG, PNG, WEBP</div></div><input type="file" id="crPhotoIn" class="photo-upload-input" accept="image/jpeg,image/png,image/gif,image/webp" onchange="handlePhotoUpload(\'crPhotoIn\',\'crPhotoP\')"></div><div class="detail-tags-section"><label style="font-size:0.8rem;color:rgba(255,255,255,0.5);margin-bottom:5px;display:block;">Profile Details</label><div class="detail-tags" id="crDT">'+crDetailTags+'</div><div class="add-detail-row"><select class="detail-select" id="crDCat">'+DETAIL_OPTIONS.map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join('')+'</select><input type="text" class="input-glass" id="crDVal" placeholder="Value" style="flex:1;min-width:150px;"><button class="btn btn-secondary btn-xs" onclick="addCRDetail()">+ Add</button></div></div><button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="showConfirm(\'Update CR\',\'Save changes?\',updateCR)">Update CR</button></div>';}
else if(adminTab==='logs'){var logs=getLogs();var logHTML='';if(logs.length){for(var i=0;i<logs.length;i++){var l=logs[i];var d=new Date(l.time);logHTML+='<div class="log-item"><span class="log-time">'+d.toLocaleTimeString()+'</span><span class="log-msg">'+esc(l.msg)+'</span></div>';}}else logHTML='<div class="empty-state"><div class="empty-icon">&#128196;</div><div class="empty-text">No activity</div></div>';content='<div class="glass" style="padding:24px;"><h3 class="section-head">Activity Log</h3><div class="activity-log">'+logHTML+'</div><button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="showConfirm(\'Clear\',\'Clear all logs?\',function(){localStorage.removeItem(LOG_KEY);navigate(\'admin-dashboard\',{tab:\'logs\'});toast(\'Cleared\',\'info\');})">Clear Logs</button></div>';}
else if(adminTab==='settings'){content='<div class="glass" style="padding:24px;"><h3 class="section-head">Settings</h3><div class="input-group"><label>Qualification Limit (Top N to Round 2)</label><div style="display:flex;gap:10px;align-items:center;"><input type="number" class="input-glass" id="qualLimit" min="2" max="20" value="'+vs.qualification_limit+'" style="width:110px;"><button class="btn btn-primary btn-sm" onclick="updateQualLimit()">Update</button></div></div><div style="margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.06);"><h4 style="font-size:0.88rem;font-weight:600;margin-bottom:8px;">View Results</h4><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-secondary btn-sm" onclick="navigate(\'semi-results\')">Semi Results</button><button class="btn btn-secondary btn-sm" onclick="navigate(\'final-results\')">Final Results</button></div></div><div style="margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.06);"><h4 style="font-size:0.88rem;font-weight:600;margin-bottom:8px;">Export</h4><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-secondary btn-sm export-btn" onclick="exportResults(this,1)">Copy R1</button><button class="btn btn-secondary btn-sm export-btn" onclick="exportResults(this,2)">Copy R2</button></div></div><div style="margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.06);"><h4 style="font-size:0.88rem;font-weight:600;margin-bottom:8px;">Change Unlock PIN</h4><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><input type="password" class="input-glass" id="newUPin" placeholder="New PIN" maxlength="6" style="width:180px;"><button class="btn btn-danger btn-sm" onclick="showConfirm(\'Change PIN\',\'Change unlock PIN?\',changeUnlockPin)">Change</button></div></div></div>';}
return '<div class="container fade-in"><div class="dash-header"><div><h2 class="section-title">Admin Dashboard</h2><p class="welcome-text" style="font-size:1rem;">Welcome, <span class="welcome-name">'+esc(s.name)+'</span></p></div></div>'+stats+tabHTML+content+'</div>';}

function filterStudentTable(){var el=document.getElementById('studentSearch');if(!el)return;var q=el.value.toLowerCase();var rows=document.querySelectorAll('.student-row');for(var i=0;i<rows.length;i++){rows[i].style.display=(rows[i].getAttribute('data-search')||'').indexOf(q)>=0?'':'none';}}
function filterVIDs(){var el=document.getElementById('vidSearch');if(!el)return;var q=el.value.toLowerCase();var tags=document.querySelectorAll('#vidTags .id-tag');for(var i=0;i<tags.length;i++){tags[i].style.display=(tags[i].getAttribute('data-search')||'').indexOf(q)>=0?'':'none';}}
function exportResults(btn,round){var db=loadDB();if(!db)return;var cands=db.Candidates.slice();cands.sort(function(a,b){return round===2?(b.round2_votes-a.round2_votes):(b.round1_votes-a.round1_votes);});var text='NextCR Round '+round+' Results\n'+('='.repeat(40))+'\n';for(var i=0;i<cands.length;i++){var c=cands[i];var v=round===2?c.round2_votes:c.round1_votes;text+=(i+1)+'. '+c.name+' ('+c.student_id+') - '+v+' votes\n';}try{navigator.clipboard.writeText(text).then(function(){var el=document.createElement('span');el.className='export-copied';el.textContent='Copied!';btn.style.position='relative';btn.appendChild(el);setTimeout(function(){if(el.parentNode)el.remove();},1500);});}catch(e){toast('Copy not supported','warning');}}
function checkCandSID(){var sidEl=document.getElementById('candSID');var nf=document.getElementById('candName');if(!sidEl||!nf)return;var sid=sidEl.value.trim();hideFieldError('candErr');var okEl=document.getElementById('candOk');if(okEl)okEl.classList.remove('show');if(sid.length<8){nf.value='';return;}if(!validateSID(sid)){showFieldError('candErr','Must be 8 digits');nf.value='';return;}var db=loadDB();if(!db)return;var entry=null;for(var i=0;i<db.ValidStudentIDs.length;i++){if(db.ValidStudentIDs[i].id===sid){entry=db.ValidStudentIDs[i];break;}}if(!entry){showFieldError('candErr','Not in valid IDs');nf.value='';return;}for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].student_id===sid){showFieldError('candErr','Already a candidate');nf.value='';return;}}nf.value=entry.name;if(okEl){okEl.textContent='Found: '+entry.name;okEl.classList.add('show');}}

function pageStudentDashboard(s){if(!s||s.role!=='student'){navigate('home');return '';}var db=loadDB();if(!db)return '';var vs=db.VotingSettings;var stu=null;for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===s.user_id){stu=db.Students[i];break;}}if(!stu){clearSession();navigate('home');toast('Session expired','error');return '';}var actionsHTML='';if(vs.final_results_declared){actionsHTML='<button class="btn btn-success" onclick="navigate(\'final-results\')">View Final Results</button>';if(vs.semi_results_declared)actionsHTML+=' <button class="btn btn-secondary btn-sm" onclick="navigate(\'semi-results\')">Semi Results</button>';}else if(vs.current_round===2&&vs.status==='Open'){if(!stu.voted_round2)actionsHTML='<button class="btn btn-success btn-lg" onclick="navigate(\'voting-round2\')">Vote Now (Round 2)</button>';else actionsHTML='<div class="glass" style="padding:16px 24px;text-align:center;border-color:rgba(0,255,135,0.15);"><span style="color:var(--aurora-green);font-size:1.2rem;margin-right:6px;">&#10003;</span><span style="color:var(--aurora-green);font-weight:600;">Already voted in Round 2</span></div>';}else if(vs.semi_results_declared&&vs.current_round===1){actionsHTML='<button class="btn btn-primary" onclick="navigate(\'semi-results\')">View Semi Results</button>';}else if(vs.current_round===1&&vs.status==='Open'){if(!stu.voted_round1)actionsHTML='<button class="btn btn-success btn-lg" onclick="navigate(\'voting-round1\')">Vote Now (Round 1)</button>';else actionsHTML='<div class="glass" style="padding:16px 24px;text-align:center;border-color:rgba(0,255,135,0.15);"><span style="color:var(--aurora-green);font-size:1.2rem;margin-right:6px;">&#10003;</span><span style="color:var(--aurora-green);font-weight:600;">Already voted in Round 1</span></div>';}else if(vs.status==='Closed'){actionsHTML='<p class="text-muted">Waiting for admin.</p>';}var cr=db.CurrentCR;var crPhoto=cr.photo?'<img src="'+esc(cr.photo)+'" class="photo-lg" onerror="this.style.display=\'none\'">':'<div class="photo-placeholder">CR</div>';return '<div class="container fade-in"><div class="dash-header"><div><h2 class="section-title">Student Dashboard</h2><p class="welcome-text" style="font-size:1rem;">Welcome, <span class="welcome-name">'+esc(stu.name)+'</span></p></div></div>'+electionStatusHTML()+'<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;">'+actionsHTML+'</div><div class="glass cr-card"><div>'+crPhoto+'</div><div class="cr-info"><span class="cr-badge">Current CR</span><h3>'+esc(cr.name)+'</h3>'+(cr.contact_no?'<p class="text-muted">+91-'+esc(cr.contact_no)+'</p>':'')+'</div></div></div>';}

function pageVotingRound(s,round){if(!s||s.role!=='student'){navigate('home');return '';}var db=loadDB();if(!db)return '';var vs=db.VotingSettings;var stu=null;for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===s.user_id){stu=db.Students[i];break;}}if(!stu){clearSession();navigate('home');toast('Session expired','error');return '';}if(vs.current_round!==round||vs.status!=='Open')return '<div class="page-center"><div class="glass card fade-in" style="text-align:center;">'+backBtn()+'<div style="font-size:3rem;margin-bottom:12px;opacity:0.3;">&#128683;</div><p class="text-muted" style="font-size:1.05rem;">Voting is not open right now.</p><button class="btn btn-secondary" style="margin-top:14px;" onclick="navigate(\'student-dashboard\')">Dashboard</button></div></div>';if((round===1&&stu.voted_round1)||(round===2&&stu.voted_round2))return '<div class="page-center"><div class="glass card fade-in" style="text-align:center;">'+backBtn()+'<div class="already-voted-check"><span>&#10003;</span></div><h3 style="color:var(--aurora-green);font-size:1.2rem;margin-bottom:8px;">Already Voted!</h3><p style="color:rgba(255,255,255,0.45);font-size:0.9rem;margin-bottom:20px;">You cast your vote in Round '+round+'.</p><button class="btn btn-secondary" onclick="navigate(\'student-dashboard\')">Dashboard</button></div></div>';var list=round===2?db.Candidates.filter(function(c){return c.qualified_for_final;}):db.Candidates;var cards='';for(var i=0;i<list.length;i++){var c=list[i];var ini=c.name?c.name[0].toUpperCase():'?';var stuData=null;for(var j=0;j<db.Students.length;j++){if(db.Students[j].student_id===c.student_id){stuData=db.Students[j];break;}}var avatarContent=stuData&&stuData.photo?'<img src="'+esc(stuData.photo)+'" alt="">':ini;var bioHTML=c.bio?'<div class="vote-bio">"'+esc(c.bio)+'"</div>':'';cards+='<div class="vote-card glass" data-cid="'+c.id+'" data-cname="'+esc(c.name)+'" onclick="selectVoteCard(this)"><div class="checkmark">&#10003;</div><div class="vote-avatar'+(round===2?' vote-avatar-final':'')+'">'+avatarContent+'</div><h4 style="font-size:0.95rem;margin-bottom:4px;">'+esc(c.name)+'</h4><p class="text-sm">ID: '+esc(c.student_id)+'</p>'+bioHTML+(round===2?'<span class="cr-badge" style="font-size:0.68rem;margin-top:8px;">Finalist</span>':'')+'</div>';}var warningBanner='<div class="vote-warning-banner glass"><div class="vote-warning-icon">&#9888;</div><div class="vote-warning-text"><strong>You can only vote ONCE!</strong><br>Cannot be changed after submission.</div></div>';var selectedDisplay='<div class="selected-candidate-display" id="selectedDisplay" style="display:none;"><span class="text-sm">Selected: </span><strong class="glow-cyan" id="selectedName"></strong></div>';return '<div class="container fade-in">'+backBtn()+'<div style="text-align:center;margin-bottom:20px;"><h2 class="section-title">Round '+round+(round===1?' &#8212; Nomination':' &#8212; Grand Final')+'</h2>'+turnoutHTML(round)+'<div class="timer-display" id="timerDisplay"></div></div>'+warningBanner+selectedDisplay+'<div class="vote-grid" id="voteGrid">'+cards+'</div><div style="text-align:center;margin-top:22px;"><button class="btn btn-success btn-lg" onclick="confirmVote('+round+')">Submit My Vote</button></div></div>';}
function selectVoteCard(el){var cards=document.querySelectorAll('.vote-card');for(var i=0;i<cards.length;i++)cards[i].classList.remove('selected');el.classList.add('selected');selectedCandId=el.getAttribute('data-cid');var nameEl=document.getElementById('selectedName');var dispEl=document.getElementById('selectedDisplay');if(nameEl)nameEl.textContent=el.getAttribute('data-cname')||'';if(dispEl)dispEl.style.display='flex';}
function confirmVote(round){if(!selectedCandId){toast('Select a candidate first','warning');return;}var db=loadDB();if(!db)return;var cand=null;for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].id===selectedCandId){cand=db.Candidates[i];break;}}if(!cand){toast('Invalid candidate','error');return;}showConfirm('Confirm Vote','Voting for: '+cand.name+'\n\nThis is FINAL. You cannot vote again.',function(){submitVote(round);});}
function submitVote(round){if(!selectedCandId)return;var s=getSession();if(!s)return;var db=loadDB();if(!db)return;var vs=db.VotingSettings;var stu=null;for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===s.user_id){stu=db.Students[i];break;}}if(!stu){toast('Not found','error');return;}if(vs.current_round!==round||vs.status!=='Open'){toast('Voting closed','error');navigate('student-dashboard');return;}if(round===1&&stu.voted_round1){toast('Already voted','error');navigate('student-dashboard');return;}if(round===2&&stu.voted_round2){toast('Already voted','error');navigate('student-dashboard');return;}var cand=null;for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].id===selectedCandId){cand=db.Candidates[i];break;}}if(!cand){toast('Invalid','error');return;}if(round===1){cand.round1_votes++;stu.voted_round1=true;}else{cand.round2_votes++;stu.voted_round2=true;}saveDB(db);var candName=cand.name;addLog(stu.name+' voted R'+round);selectedCandId=null;showVoteSuccess(candName,round);}

function pageSemiResults(){var db=loadDB();if(!db)return '';if(!db.VotingSettings.semi_results_declared)return '<div class="page-center"><div class="glass card fade-in" style="text-align:center;">'+backBtn()+'<p class="text-muted">Results will be announced by Admin.</p></div></div>';var sorted=db.Candidates.slice().sort(function(a,b){return(b.round1_votes||0)-(a.round1_votes||0);});var maxV=Math.max((sorted[0]&&sorted[0].round1_votes)||0,1);var qualCount=0;for(var i=0;i<sorted.length;i++){if(sorted[i].qualified_for_final)qualCount++;}var rows='';for(var i=0;i<sorted.length;i++){var c=sorted[i];var pct=(c.round1_votes/maxV*100);var q=c.qualified_for_final;var bg=q?'linear-gradient(135deg,var(--aurora-green),var(--aurora-cyan))':'rgba(255,255,255,0.08)';var col=q?'#0a0e27':'#fff';var rowClass=q?'qualified-row result-stagger':'result-stagger';var delay='animation-delay:'+(i*0.12)+'s;';rows+='<div class="glass result-row '+rowClass+'" style="'+delay+'"><div class="result-rank" style="background:'+bg+';color:'+col+';">'+(i+1)+'</div><div style="flex:1;"><div class="result-info"><h4>'+(q?'<span class="qualified-star" style="animation-delay:'+(i*0.12+0.3)+'s;">&#11088;</span>':'')+esc(c.name)+(q?' <span class="glow-green" style="font-size:0.78rem;">Qualified!</span>':'')+'</h4><span class="result-votes count-up" data-target="'+c.round1_votes+'">0</span></div><div class="result-bar-bg"><div class="result-bar" style="width:0%;" data-width="'+pct+'"></div></div></div></div>';}setTimeout(function(){animateResults();launchConfetti('semi');},300);return '<div class="container fade-in"><canvas class="celebration-canvas" id="celebCanvas"></canvas>'+backBtn()+'<div style="text-align:center;margin-bottom:28px;"><h2 class="section-title">Semi-Final Results</h2></div><div class="glass" style="padding:30px;margin-bottom:24px;text-align:center;border-color:rgba(0,255,135,0.2);"><div class="congrats-text">&#127881; Congratulations! &#127881;</div><p style="color:rgba(255,255,255,0.5);font-size:0.95rem;">Top <strong class="glow-green">'+qualCount+'</strong> qualified for the Final!</p></div>'+rows+'</div>';}

function pageFinalResults(){var db=loadDB();if(!db)return '';if(!db.VotingSettings.final_results_declared)return '<div class="page-center"><div class="glass card fade-in" style="text-align:center;">'+backBtn()+'<p class="text-muted">Results will be announced by Admin.</p></div></div>';var finalists=db.Candidates.filter(function(c){return c.qualified_for_final;}).sort(function(a,b){return b.round2_votes-a.round2_votes;});var maxV=Math.max((finalists[0]&&finalists[0].round2_votes)||1,1);var w=finalists[0];var winHTML='';if(w){var stuData=null;for(var j=0;j<db.Students.length;j++){if(db.Students[j].student_id===w.student_id){stuData=db.Students[j];break;}}var avatarContent=stuData&&stuData.photo?'<img src="'+esc(stuData.photo)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">':w.name[0].toUpperCase();winHTML='<div class="glass winner-glow" style="padding:44px;margin-bottom:24px;text-align:center;border-color:rgba(0,255,135,0.25);"><div class="congrats-text" style="font-size:2rem;">&#127881; Congratulations! &#127881;</div><div class="trophy-icon">&#x1F451;</div><div class="winner-sparkle"><div class="winner-avatar">'+avatarContent+'</div></div><h2 class="winner-name" style="font-size:1.8rem;">'+esc(w.name)+'</h2><div class="winner-badge-anim" style="display:inline-block;"><span class="cr-badge" style="font-size:0.95rem;padding:8px 28px;">&#127942; Next Class CR &#127942;</span></div><p class="text-muted" style="margin-top:14px;font-size:1.1rem;">Won with <strong class="glow-green" style="font-size:1.3rem;">'+w.round2_votes+'</strong> votes</p></div>';}var medals=['linear-gradient(135deg,var(--aurora-green),var(--aurora-cyan))','linear-gradient(135deg,#ffd700,#ffaa00)','linear-gradient(135deg,#c0c0c0,#888)'];var medalEmoji=['&#x1F947;','&#x1F948;','&#x1F949;'];var rows='';for(var i=0;i<finalists.length;i++){var c=finalists[i];var pct=(c.round2_votes/maxV*100);var bg=i<3?medals[i]:'rgba(255,255,255,0.08)';var col=i<3?'#0a0e27':'#fff';var delay='animation-delay:'+(i*0.15+0.5)+'s;';rows+='<div class="glass result-row result-stagger" style="'+delay+(i===0?'border-color:rgba(0,255,135,0.25);':'')+'"><div class="result-rank" style="background:'+bg+';color:'+col+';">'+(i+1)+'</div><div style="flex:1;"><div class="result-info"><h4>'+(i<3?medalEmoji[i]+' ':'')+esc(c.name)+(i===0?' <span class="glow-green">(Winner)</span>':'')+'</h4><span class="result-votes count-up" data-target="'+c.round2_votes+'">0</span></div><div class="result-bar-bg"><div class="result-bar" style="width:0%;" data-width="'+pct+'"></div></div></div></div>';}setTimeout(function(){animateResults();launchConfetti('final');},300);return '<div class="container fade-in"><canvas class="celebration-canvas" id="celebCanvas"></canvas>'+backBtn()+'<div style="text-align:center;margin-bottom:28px;"><h2 class="section-title" style="animation:congratsAppear 0.5s ease both;">&#127942; Final Results &#127942;</h2></div>'+winHTML+rows+'</div>';}
function animateResults(){var bars=document.querySelectorAll('.result-bar');for(var i=0;i<bars.length;i++){(function(bar){setTimeout(function(){bar.style.width=bar.getAttribute('data-width')+'%';},100);})(bars[i]);}var counters=document.querySelectorAll('.count-up');for(var i=0;i<counters.length;i++){(function(el){var target=parseInt(el.getAttribute('data-target'))||0;var current=0;var step=Math.max(1,Math.ceil(target/30));var interval=setInterval(function(){current+=step;if(current>=target){current=target;clearInterval(interval);}el.textContent=current+' votes';},40);})(counters[i]);}}

function pageProfile(s){if(!s){navigate('login');return '';}var db=loadDB();if(!db)return '';var user=null,roleText='';if(s.role==='student'){for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===s.user_id){user=db.Students[i];break;}}roleText='Student';}else{for(var i=0;i<db.Admins.length;i++){if(db.Admins[i].id===s.user_id){user=db.Admins[i];break;}}roleText='Admin';}if(!user){clearSession();navigate('home');toast('Session expired','error');return '';}window._photoData={};var photoHTML=user.photo?'<img src="'+esc(user.photo)+'" class="photo-lg photo-xl">':'<div class="photo-placeholder photo-xl">'+esc(user.name?user.name[0]:'?')+'</div>';var detailTags='';if(user.profile_details&&user.profile_details.length){for(var i=0;i<user.profile_details.length;i++){var d=user.profile_details[i];detailTags+='<span class="detail-tag">'+esc(d.category)+': '+esc(d.value)+'<button class="detail-tag-x" onclick="showConfirm(\'Remove\',\'Remove this detail?\',function(){removeProfileDetail('+i+')})">x</button></span>';}}return '<div class="page-center"><div class="glass card card-wide fade-in">'+backBtn()+'<div style="text-align:center;margin-bottom:20px;">'+photoHTML+'<h2 class="card-title" style="margin-top:14px;">'+esc(user.name)+'</h2><p style="font-size:0.8rem;color:rgba(255,255,255,0.35);">'+roleText+'</p></div><div class="input-group"><label>Name</label><input type="text" class="input-glass" id="profName" value="'+esc(user.name)+'"><div class="field-error" id="profNameErr"></div></div><div class="input-group"><label>Contact No</label><div class="contact-row"><span class="contact-prefix">+91-</span><input type="text" class="input-glass" id="profContact" value="'+esc(user.contact_no||'')+'" maxlength="10" oninput="validateFieldLive(\'profContact\',\'profContactErr\',validateContact,\'Must be 10 digits\')"></div><div class="field-error" id="profContactErr"></div></div><div class="input-group"><label>Profile Photo</label><div class="photo-upload-area" onclick="document.getElementById(\'profPhotoIn\').click()"><div class="photo-upload-preview" id="profPhotoP">'+(user.photo?'<img src="'+esc(user.photo)+'">':'&#128247;')+'</div><div class="photo-upload-text"><strong>Upload Photo</strong></div></div><input type="file" id="profPhotoIn" class="photo-upload-input" accept="image/jpeg,image/png,image/gif,image/webp" onchange="handlePhotoUpload(\'profPhotoIn\',\'profPhotoP\')"></div><div class="detail-tags-section"><label style="font-size:0.8rem;color:rgba(255,255,255,0.5);margin-bottom:5px;display:block;">Profile Details</label><div class="detail-tags" id="profDT">'+detailTags+'</div><div class="add-detail-row"><select class="detail-select" id="profDCat">'+DETAIL_OPTIONS.map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join('')+'</select><input type="text" class="input-glass" id="profDVal" placeholder="Value" style="flex:1;min-width:150px;"><button class="btn btn-secondary btn-xs" onclick="addProfileDetail()">+ Add</button></div></div><button class="btn btn-primary btn-full" onclick="showConfirm(\'Save\',\'Save profile?\',saveProfile)">Save Changes</button></div></div>';}
function addProfileDetail(){var catEl=document.getElementById('profDCat');var valEl=document.getElementById('profDVal');if(!catEl||!valEl)return;var cat=catEl.value,val=valEl.value.trim();if(!val){toast('Enter a value','error');return;}var s=getSession();if(!s)return;var db=loadDB();if(!db)return;var user=null;if(s.role==='student'){for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===s.user_id){user=db.Students[i];break;}}}else{for(var i=0;i<db.Admins.length;i++){if(db.Admins[i].id===s.user_id){user=db.Admins[i];break;}}}if(!user)return;if(!user.profile_details)user.profile_details=[];user.profile_details.push({category:cat,value:val});saveDB(db);navigate('profile');toast('Detail added','success');}
function removeProfileDetail(idx){var s=getSession();if(!s)return;var db=loadDB();if(!db)return;var user=null;if(s.role==='student'){for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===s.user_id){user=db.Students[i];break;}}}else{for(var i=0;i<db.Admins.length;i++){if(db.Admins[i].id===s.user_id){user=db.Admins[i];break;}}}if(!user||!user.profile_details)return;user.profile_details.splice(idx,1);saveDB(db);navigate('profile');toast('Removed','info');}
function saveProfile(){var s=getSession();if(!s)return;var db=loadDB();if(!db)return;var nameEl=document.getElementById('profName');var contactEl=document.getElementById('profContact');if(!nameEl)return;var name=nameEl.value.trim();var contact=contactEl?contactEl.value.trim():'';if(!name){showFieldError('profNameErr','Name required');return;}if(contact&&!validateContact(contact)){showFieldError('profContactErr','Must be 10 digits');return;}var photo=(window._photoData&&window._photoData['profPhotoIn'])||null;var user=null;if(s.role==='student'){for(var i=0;i<db.Students.length;i++){if(db.Students[i].id===s.user_id){user=db.Students[i];break;}}}else{for(var i=0;i<db.Admins.length;i++){if(db.Admins[i].id===s.user_id){user=db.Admins[i];break;}}}if(!user)return;user.name=name;user.contact_no=contact;if(photo)user.photo=photo;s.name=name;saveDB(db);setSession(s);addLog('Profile updated: '+name);navigate('profile');toast('Profile updated!','success');}

function adminAction(action){var db=loadDB();if(!db)return;var vs=db.VotingSettings;var dur=(action==='start_r1'||action==='start_r2')?getTimerSeconds():null;if(action==='start_r1'){if(!db.Candidates.length){toast('Add candidates first','error');return;}vs.current_round=1;vs.status='Open';vs.semi_results_declared=false;vs.final_results_declared=false;vs.round_start_time=Date.now();vs.round_duration=dur;for(var i=0;i<db.Students.length;i++){db.Students[i].voted_round1=false;db.Students[i].voted_round2=false;}for(var i=0;i<db.Candidates.length;i++){db.Candidates[i].round1_votes=0;db.Candidates[i].round2_votes=0;db.Candidates[i].qualified_for_final=false;}saveDB(db);addLog('Round 1 started');navigate('admin-dashboard',{tab:'election'});toast('Round 1 started!','success');}else if(action==='close_r1'){if(vs.current_round!==1||vs.status!=='Open'){toast('Round 1 not open','error');return;}vs.status='Closed';vs.round_start_time=null;vs.round_duration=null;saveDB(db);addLog('Round 1 closed');navigate('admin-dashboard',{tab:'election'});toast('Round 1 closed!','info');}else if(action==='declare_semi'){if(vs.current_round!==1||vs.status!=='Closed'){toast('Close Round 1 first','error');return;}var sorted=db.Candidates.slice().sort(function(a,b){return b.round1_votes-a.round1_votes;});for(var i=0;i<sorted.length;i++){for(var j=0;j<db.Candidates.length;j++){if(db.Candidates[j].id===sorted[i].id){db.Candidates[j].qualified_for_final=i<vs.qualification_limit;break;}}}vs.semi_results_declared=true;saveDB(db);addLog('Semi declared');navigate('admin-dashboard',{tab:'election'});toast('Semi results declared!','success');}else if(action==='start_r2'){if(!vs.semi_results_declared){toast('Declare semi first','error');return;}vs.current_round=2;vs.status='Open';vs.round_start_time=Date.now();vs.round_duration=dur;for(var i=0;i<db.Students.length;i++){db.Students[i].voted_round2=false;}for(var i=0;i<db.Candidates.length;i++){db.Candidates[i].round2_votes=0;}saveDB(db);addLog('Round 2 started');navigate('admin-dashboard',{tab:'election'});toast('Round 2 started!','success');}else if(action==='close_r2'){if(vs.current_round!==2||vs.status!=='Open'){toast('Round 2 not open','error');return;}vs.status='Closed';vs.round_start_time=null;vs.round_duration=null;saveDB(db);addLog('Round 2 closed');navigate('admin-dashboard',{tab:'election'});toast('Round 2 closed!','info');}else if(action==='declare_final'){if(vs.current_round!==2||vs.status!=='Closed'){toast('Close Round 2 first','error');return;}vs.final_results_declared=true;var finalists=db.Candidates.filter(function(c){return c.qualified_for_final;}).sort(function(a,b){return b.round2_votes-a.round2_votes;});if(finalists.length){db.CurrentCR.name=finalists[0].name;db.CurrentCR.details='Elected via NextCR';var stu=null;for(var j=0;j<db.Students.length;j++){if(db.Students[j].student_id===finalists[0].student_id){stu=db.Students[j];break;}}if(stu&&stu.photo)db.CurrentCR.photo=stu.photo;}saveDB(db);addLog('Final declared');navigate('admin-dashboard',{tab:'election'});toast('Final results declared!','success');}else if(action==='reset'){for(var i=0;i<db.Students.length;i++){db.Students[i].voted_round1=false;db.Students[i].voted_round2=false;}db.Candidates=[];vs.current_round=0;vs.status='NotStarted';vs.semi_results_declared=false;vs.final_results_declared=false;vs.round_start_time=null;vs.round_duration=null;saveDB(db);addLog('Election reset');navigate('admin-dashboard',{tab:'election'});toast('Election reset!','info');}}
function addCandidate(){var sidEl=document.getElementById('candSID');var nameEl=document.getElementById('candName');var bioEl=document.getElementById('candBio');if(!sidEl||!nameEl)return;var sid=sidEl.value.trim(),name=nameEl.value.trim(),bio=bioEl?bioEl.value:'';hideFieldError('candErr');if(!validateSID(sid)){showFieldError('candErr','Must be 8 digits');return;}if(!name){showFieldError('candErr','Enter valid Student ID');return;}var db=loadDB();if(!db)return;var found=false;for(var i=0;i<db.ValidStudentIDs.length;i++){if(db.ValidStudentIDs[i].id===sid){found=true;break;}}if(!found){showFieldError('candErr','Not in valid IDs');return;}for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].student_id===sid){showFieldError('candErr','Already a candidate');return;}}db.Candidates.push({id:uid(),name:name,student_id:sid,round1_votes:0,round2_votes:0,qualified_for_final:false,bio:bio});saveDB(db);addLog('Candidate added: '+name);navigate('admin-dashboard',{tab:'candidates'});toast('Candidate added!','success');}
function deleteCandidate(cid){var db=loadDB();if(!db)return;var cName='unknown';db.Candidates=db.Candidates.filter(function(x){if(x.id===cid)cName=x.name||'unknown';return x.id!==cid;});saveDB(db);addLog('Candidate deleted: '+cName);navigate('admin-dashboard',{tab:'candidates'});toast('Deleted','info');}
function addValidID(){var vidEl=document.getElementById('addVID');var vnameEl=document.getElementById('addVName');if(!vidEl||!vnameEl)return;var vid=vidEl.value.trim(),vname=vnameEl.value.trim();hideFieldError('vidErr');if(!validateSID(vid)){showFieldError('vidErr','Must be 8 digits');return;}if(!vname){showFieldError('vidErr','Name required');return;}var db=loadDB();if(!db)return;for(var i=0;i<db.ValidStudentIDs.length;i++){if(db.ValidStudentIDs[i].id===vid){showFieldError('vidErr','Already exists');return;}}db.ValidStudentIDs.push({id:vid,name:vname});saveDB(db);addLog('ID added: '+vid);navigate('admin-dashboard',{tab:'validids'});toast('Added','success');}
function bulkAddIDs(){var rawEl=document.getElementById('bulkVIDs');if(!rawEl)return;var raw=rawEl.value;var entries=raw.split(',');var db=loadDB();if(!db)return;var added=0;for(var i=0;i<entries.length;i++){var s=entries[i].trim();if(!s)continue;var parts=s.split(':');if(parts.length===2){var id=parts[0].trim(),name=parts[1].trim();if(validateSID(id)&&name){var exists=false;for(var j=0;j<db.ValidStudentIDs.length;j++){if(db.ValidStudentIDs[j].id===id){exists=true;break;}}if(!exists){db.ValidStudentIDs.push({id:id,name:name});added++;}}}}saveDB(db);addLog(added+' IDs bulk added');navigate('admin-dashboard',{tab:'validids'});toast(added+' added','success');}
function removeValidID(vid){var db=loadDB();if(!db)return;db.ValidStudentIDs=db.ValidStudentIDs.filter(function(v){return v.id!==vid;});saveDB(db);addLog('ID removed: '+vid);navigate('admin-dashboard',{tab:'validids'});toast('Removed','info');}
function updateQualLimit(){var el=document.getElementById('qualLimit');if(!el)return;var v=parseInt(el.value);if(isNaN(v)||v<2||v>20){toast('Must be 2-20','error');return;}var db=loadDB();if(!db)return;db.VotingSettings.qualification_limit=v;saveDB(db);addLog('Qual limit: '+v);toast('Updated to '+v,'success');}
function updateCR(){var db=loadDB();if(!db)return;var nameEl=document.getElementById('crName');var contactEl=document.getElementById('crContact');var detailsEl=document.getElementById('crDetails');if(nameEl)db.CurrentCR.name=nameEl.value.trim()||db.CurrentCR.name;var contact=contactEl?contactEl.value.trim():'';if(contact&&!validateContact(contact)){toast('Contact must be 10 digits','error');return;}db.CurrentCR.contact_no=contact;if(detailsEl)db.CurrentCR.details=detailsEl.value.trim();var photo=(window._photoData&&window._photoData['crPhotoIn'])||null;if(photo)db.CurrentCR.photo=photo;saveDB(db);addLog('CR updated');navigate('admin-dashboard',{tab:'currentcr'});toast('CR updated','success');}
function addCRDetail(){var catEl=document.getElementById('crDCat');var valEl=document.getElementById('crDVal');if(!catEl||!valEl)return;var cat=catEl.value,val=valEl.value.trim();if(!val){toast('Enter a value','error');return;}var db=loadDB();if(!db)return;if(!db.CurrentCR.profile_details)db.CurrentCR.profile_details=[];db.CurrentCR.profile_details.push({category:cat,value:val});saveDB(db);navigate('admin-dashboard',{tab:'currentcr'});toast('Added','success');}
function removeCRDetail(idx){var db=loadDB();if(!db||!db.CurrentCR.profile_details)return;db.CurrentCR.profile_details.splice(idx,1);saveDB(db);navigate('admin-dashboard',{tab:'currentcr'});toast('Removed','info');}
function changeUnlockPin(){var el=document.getElementById('newUPin');if(!el)return;var pin=el.value.trim();if(!validatePin(pin)){toast('Must be 4-6 digits','error');return;}var db=loadDB();if(!db)return;db.AdminUnlockPin=hashPw(pin);saveDB(db);addLog('PIN changed');toast('PIN changed!','success');}

function launchConfetti(type){var canvas=document.getElementById('celebCanvas');if(!canvas)return;var ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;var particles=[];var colors=type==='final'?['#00ff87','#00d4ff','#ffd700','#ff6b81','#b44aff','#fff','#ff9500','#00ffcc']:['#00ff87','#00d4ff','#b44aff','#ffd700','#fff'];var count=type==='final'?250:150;var gravity=type==='final'?0.1:0.1;var duration=type==='final'?7000:5000;for(var i=0;i<count;i++){var angle=Math.random()*Math.PI*2;var speed=Math.random()*8+3;particles.push({x:canvas.width*(0.2+Math.random()*0.6),y:canvas.height*(0.2+Math.random()*0.3),vx:Math.cos(angle)*speed*(Math.random()*2-1),vy:Math.sin(angle)*speed*-1-Math.random()*3,color:colors[Math.floor(Math.random()*colors.length)],size:Math.random()*6+2,rotation:Math.random()*360,rotSpeed:(Math.random()-0.5)*10,opacity:1,shape:Math.random()>0.5?'rect':'circle',decay:0.004+Math.random()*0.006});}var startTime=Date.now();(function animate(){if(Date.now()-startTime>duration){ctx.clearRect(0,0,canvas.width,canvas.height);return;}ctx.clearRect(0,0,canvas.width,canvas.height);var alive=false;for(var i=0;i<particles.length;i++){var p=particles[i];if(p.opacity<=0)continue;alive=true;p.x+=p.vx;p.vy+=gravity;p.y+=p.vy;p.vx*=0.99;p.rotation+=p.rotSpeed;p.opacity-=p.decay;if(p.opacity<0)p.opacity=0;ctx.save();ctx.globalAlpha=p.opacity;ctx.translate(p.x,p.y);ctx.rotate(p.rotation*Math.PI/180);ctx.fillStyle=p.color;if(p.shape==='rect')ctx.fillRect(-p.size/2,-p.size*1.5/2,p.size,p.size*1.5);else{ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);ctx.fill();}ctx.restore();}if(alive)requestAnimationFrame(animate);else ctx.clearRect(0,0,canvas.width,canvas.height);})();}

function initSnow(){var c=document.getElementById('snowfall');if(!c)return;for(var i=0;i<60;i++){var f=document.createElement('div');f.className='snowflake';var s=Math.random()*4+1;f.style.width=s+'px';f.style.height=s+'px';f.style.left=Math.random()*100+'%';f.style.animationDuration=(Math.random()*10+8)+'s';f.style.animationDelay=(Math.random()*15)+'s';f.style.opacity=Math.random()*0.5+0.1;c.appendChild(f);}}

function initParticles(){var c=document.getElementById('particles');if(!c)return;var colors=['rgba(0,255,135,0.6)','rgba(0,212,255,0.6)','rgba(180,74,255,0.5)','rgba(255,215,0,0.4)'];for(var i=0;i<20;i++){var p=document.createElement('div');p.className='particle';var s=Math.random()*4+1;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDuration=(Math.random()*15+10)+'s';p.style.animationDelay=(Math.random()*20)+'s';p.style.boxShadow='0 0 '+(s*3)+'px '+colors[Math.floor(Math.random()*colors.length)];c.appendChild(p);}}

function startApp(){
var session=getSession();var saved=loadSavedPage();
if(session&&saved&&saved.page){currentPage=saved.page;if(saved.tab)adminTab=saved.tab;if((currentPage==='admin-dashboard'||currentPage==='admin-unlock')&&(!session||session.role!=='admin'))currentPage='home';else if(currentPage==='admin-dashboard'&&!session.unlocked)currentPage='admin-unlock';if((currentPage==='student-dashboard'||currentPage==='voting-round1'||currentPage==='voting-round2')&&(!session||session.role!=='student'))currentPage='home';if(currentPage==='profile'&&!session)currentPage='home';}else currentPage='home';
render();startTimer();
if(!_serverSync){toast('Server offline — data saved locally','warning');}
}
