<script>
(function(){
"use strict";

var DB_KEY='nextcr_db',SESSION_KEY='nextcr_session',PAGE_KEY='nextcr_page',LOG_KEY='nextcr_log';
var DETAIL_OPTIONS=['Achievements','Hobbies','Experience','Skills','Certifications','Languages','Sports','Clubs','Volunteer Work','Projects','Interests','Leadership'];
var currentPage='home',adminTab='election',selectedCandId=null,_confirmCb=null,_pageHistory=[];
var cropState={targetInput:null,targetPreview:null,imgData:null,scale:1,ox:0,oy:0,dragging:false,sx:0,sy:0,baseW:0,baseH:0};
var votingTimer=null,mobileMenuOpen=false;

var _serverSync=false,_syncPending=false,_syncTimer=null;

function initDB(cb){
fetchFromServer(function(serverDb){
if(serverDb){
localStorage.setItem(DB_KEY,JSON.stringify(serverDb));
_serverSync=true;
migrateDB();
if(cb)cb();
}else{
var raw=localStorage.getItem(DB_KEY);
if(!raw){
var db={ValidStudentIDs:[],Students:[],Admins:[],Candidates:[],AdminUnlockPin:'',
VotingSettings:{current_round:0,status:'NotStarted',qualification_limit:5,semi_results_declared:false,final_results_declared:false,round_start_time:null,round_duration:null},
CurrentCR:{name:'Not Assigned Yet',photo:'',contact_no:'',details:'',profile_details:[]}};
localStorage.setItem(DB_KEY,JSON.stringify(db));
}
migrateDB();
if(cb)cb();
}
});
}
function migrateDB(){
var db=loadDB();if(!db){localStorage.removeItem(DB_KEY);var d={ValidStudentIDs:[],Students:[],Admins:[],Candidates:[],AdminUnlockPin:'',VotingSettings:{current_round:0,status:'NotStarted',qualification_limit:5,semi_results_declared:false,final_results_declared:false,round_start_time:null,round_duration:null},CurrentCR:{name:'Not Assigned Yet',photo:'',contact_no:'',details:'',profile_details:[]}};localStorage.setItem(DB_KEY,JSON.stringify(d));return;}
var changed=false;
if(db.AdminUnlockPin===undefined){db.AdminUnlockPin='';changed=true;}
if(!db.CurrentCR){db.CurrentCR={name:'Not Assigned Yet',photo:'',contact_no:'',details:'',profile_details:[]};changed=true;}
if(!db.CurrentCR.profile_details){db.CurrentCR.profile_details=[];changed=true;}
if(!db.VotingSettings){db.VotingSettings={current_round:0,status:'NotStarted',qualification_limit:5,semi_results_declared:false,final_results_declared:false,round_start_time:null,round_duration:null};changed=true;}
if(db.VotingSettings.round_start_time===undefined){db.VotingSettings.round_start_time=null;changed=true;}
if(db.VotingSettings.round_duration===undefined){db.VotingSettings.round_duration=null;changed=true;}
if(!db.Candidates)db.Candidates=[];if(!db.Students)db.Students=[];if(!db.Admins)db.Admins=[];if(!db.ValidStudentIDs)db.ValidStudentIDs=[];
for(var i=0;i<db.Students.length;i++){if(!db.Students[i].profile_details){db.Students[i].profile_details=[];changed=true;}if(db.Students[i].photo===undefined){db.Students[i].photo='';changed=true;}}
for(var i=0;i<db.Admins.length;i++){if(!db.Admins[i].profile_details){db.Admins[i].profile_details=[];changed=true;}if(db.Admins[i].photo===undefined){db.Admins[i].photo='';changed=true;}}
for(var i=0;i<db.Candidates.length;i++){if(db.Candidates[i].bio===undefined){db.Candidates[i].bio='';changed=true;}}
if(changed)localStorage.setItem(DB_KEY,JSON.stringify(db));
}
function fetchFromServer(cb){
try{
console.log('[Load] Fetching from server...');
var xhr=new XMLHttpRequest();
xhr.open('GET','/api/db/load',true);
xhr.timeout=15000;
xhr.onload=function(){
if(xhr.status===200){
try{
var r=JSON.parse(xhr.responseText);
if(r.ok&&r.db&&typeof r.db==='object'){
console.log('[Load] Got data from Excel:',
(r.db.ValidStudentIDs||[]).length+' IDs,',
(r.db.Students||[]).length+' students,',
(r.db.Admins||[]).length+' admins,',
(r.db.Candidates||[]).length+' candidates');
cb(r.db);return;
}else{console.error('[Load] Server returned:',r);}
}catch(e){console.error('[Load] Parse error:',e);}
}else{console.error('[Load] HTTP '+xhr.status);}
cb(null);
};
xhr.onerror=function(){console.log('[Load] Server offline, using local storage');cb(null);};
xhr.ontimeout=function(){console.log('[Load] Server timeout (15s)');cb(null);};
xhr.send();
}catch(e){console.error('[Load] Exception:',e);cb(null);}
}
function syncToServer(db){
if(!_serverSync){console.log('[Sync] Server not available, skipping');return;}
try{
_syncPending=true;
var dbCopy=JSON.parse(JSON.stringify(db));
var bodyStr=JSON.stringify({db:dbCopy});
console.log('[Sync] Sending '+Math.round(bodyStr.length/1024)+'KB to server...');
var xhr=new XMLHttpRequest();
xhr.open('POST','/api/db/save',true);
xhr.setRequestHeader('Content-Type','application/json');
xhr.timeout=30000;
xhr.onload=function(){
if(xhr.status===200){
try{
var r=JSON.parse(xhr.responseText);
if(r.ok){_serverSync=true;_syncPending=false;console.log('[Sync] Saved to Excel OK');}
else{console.error('[Sync] Server error:',r.error);_syncPending=true;toast('Excel save error: '+r.error,'error');}
}catch(e){console.error('[Sync] Parse error:',e);_syncPending=true;}
}else{console.error('[Sync] HTTP '+xhr.status);_syncPending=true;}
};
xhr.onerror=function(){console.error('[Sync] Network error');_syncPending=true;_serverSync=false;};
xhr.ontimeout=function(){console.error('[Sync] Timeout (30s)');_syncPending=true;};
xhr.send(bodyStr);
}catch(e){console.error('[Sync] Exception:',e);_syncPending=true;}
}
function debouncedSync(db){
if(_syncTimer)clearTimeout(_syncTimer);
_syncTimer=setTimeout(function(){syncToServer(db);},300);
}
function loadDB(){try{var d=JSON.parse(localStorage.getItem(DB_KEY));return d&&typeof d==='object'?d:null;}catch(e){return null;}}
function saveDB(db){try{var str=JSON.stringify(db);localStorage.setItem(DB_KEY,str);console.log('[DB] Saved to localStorage ('+Math.round(str.length/1024)+'KB)');debouncedSync(db);}catch(e){console.error('[DB] localStorage error:',e);toast('Storage error! Data may be too large.','error');}}
function getSession(){try{var s=localStorage.getItem(SESSION_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function setSession(d){localStorage.setItem(SESSION_KEY,JSON.stringify(d));}
function clearSession(){localStorage.removeItem(SESSION_KEY);localStorage.removeItem(PAGE_KEY);}
function savePage(){localStorage.setItem(PAGE_KEY,JSON.stringify({page:currentPage,tab:adminTab}));}
function loadSavedPage(){try{var s=localStorage.getItem(PAGE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function uid(){return Math.random().toString(36).substr(2,10)+Date.now().toString(36);}
function esc(t){if(t==null)return '';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function hashPw(s){
if(!s||typeof s!=='string')return 'h_invalid_0';
// Simple but consistent hash that works in all browsers
// Uses the same algorithm as Python's hashlib.sha256 would be ideal,
// but for compatibility we use a strong JS hash
var hash=0,h2=0,h3=0;
for(var i=0;i<s.length;i++){
var c=s.charCodeAt(i);
hash=((hash<<5)-hash)+c;hash|=0;
h2=((h2<<7)-h2)+c;h2|=0;
h3=((h3<<11)-h3)+c;h3|=0;
}
for(var i=s.length-1;i>=0;i--){
var c=s.charCodeAt(i);
hash=((hash<<3)-hash)+c*31;hash|=0;
h2=((h2<<5)-h2)+c*37;h2|=0;
}
return 'jsh_'+Math.abs(hash).toString(36)+'_'+Math.abs(h2).toString(36)+'_'+Math.abs(h3).toString(36)+'_'+s.length;
}
function addLog(msg){var logs;try{logs=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){logs=[];}logs.unshift({time:Date.now(),msg:String(msg)});if(logs.length>50)logs=logs.slice(0,50);try{localStorage.setItem(LOG_KEY,JSON.stringify(logs));}catch(e){}}
function getLogs(){try{return JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){return [];}}
function toast(m,t){t=t||'info';var b=document.getElementById('toastBox');if(!b)return;var d=document.createElement('div');d.className='toast toast-'+({success:'ok',error:'err',info:'info',warning:'warn'}[t]||'info');d.textContent=m;b.appendChild(d);setTimeout(function(){if(d.parentNode)d.remove();},3500);}
function togglePw(id,btn){var i=document.getElementById(id);if(!i)return;if(i.type==='password'){i.type='text';btn.textContent='Hide';}else{i.type='password';btn.textContent='Show';}}
function showConfirm(title,msg,cb){document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmMsg').textContent=msg;document.getElementById('confirmOverlay').classList.add('active');_confirmCb=cb;}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('active');_confirmCb=null;}
function validateSID(v){return /^\d{8}$/.test(v);}
function validatePin(v){return /^\d{4,6}$/.test(v);}
function validateContact(v){return /^\d{10}$/.test(v);}
function validatePassword(v){return v.length>=4;}
function showFieldError(id,m){var e=document.getElementById(id);if(e){e.textContent=m;e.classList.add('show');}}
function hideFieldError(id){var e=document.getElementById(id);if(e){e.textContent='';e.classList.remove('show');}}
function setInputState(id,s){var e=document.getElementById(id);if(!e)return;e.classList.remove('input-error','input-success');if(s==='error')e.classList.add('input-error');else if(s==='success')e.classList.add('input-success');}
function validateFieldLive(iid,eid,fn,em){var el=document.getElementById(iid);if(!el)return;var v=el.value.trim();if(!v){hideFieldError(eid);setInputState(iid,'');return;}if(!fn(v)){showFieldError(eid,em);setInputState(iid,'error');}else{hideFieldError(eid);setInputState(iid,'success');}}
function updatePwStrength(inputId,barPrefix){var el=document.getElementById(inputId);if(!el)return;var v=el.value;var score=0;if(v.length>=4)score++;if(v.length>=8)score++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))score++;if(/\d/.test(v))score++;if(/[^a-zA-Z0-9]/.test(v))score++;var labels=['','Weak','Fair','Good','Strong','Very Strong'];var cls=['','active','medium','medium','strong','strong'];for(var i=1;i<=4;i++){var bar=document.getElementById(barPrefix+i);if(!bar)continue;bar.className='pw-bar';if(i<=score)bar.classList.add(cls[score]||'active');}var lbl=document.getElementById(barPrefix+'label');if(lbl)lbl.textContent=score>0?labels[score]:'';}

function handlePhotoUpload(inputId,previewId){var input=document.getElementById(inputId);if(!input||!input.files||!input.files[0])return;var file=input.files[0];var valid=['image/jpeg','image/png','image/gif','image/webp'];if(valid.indexOf(file.type)===-1){toast('Only JPG, PNG, GIF, WEBP allowed','error');input.value='';return;}if(file.size>2*1024*1024){toast('Image must be under 2MB','error');input.value='';return;}var r=new FileReader();r.onload=function(e){openCropModal(e.target.result,inputId,previewId);};r.onerror=function(){toast('Failed to read file','error');};r.readAsDataURL(file);}
function openCropModal(imgData,inputId,previewId){cropState={targetInput:inputId,targetPreview:previewId,imgData:imgData,scale:1,ox:0,oy:0,dragging:false,sx:0,sy:0,baseW:0,baseH:0};var modal=document.getElementById('cropModal');var img=document.getElementById('cropImg');img.src=imgData;document.getElementById('cropZoom').value=100;modal.classList.add('active');img.onload=function(){var cw=300,ch=300;var ratio=Math.max(cw/img.naturalWidth,ch/img.naturalHeight);var w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;img.style.width=w+'px';img.style.height=h+'px';img.style.left=((cw-w)/2)+'px';img.style.top=((ch-h)/2)+'px';cropState.baseW=w;cropState.baseH=h;cropState.ox=(cw-w)/2;cropState.oy=(ch-h)/2;};}
function cropZoomHandler(){var v=parseInt(document.getElementById('cropZoom').value)/100;var img=document.getElementById('cropImg');if(!img)return;img.style.width=(cropState.baseW*v)+'px';img.style.height=(cropState.baseH*v)+'px';cropState.scale=v;}
function cropMouseDown(e){cropState.dragging=true;cropState.sx=e.clientX;cropState.sy=e.clientY;e.preventDefault();}
function cropMouseMove(e){if(!cropState.dragging)return;var img=document.getElementById('cropImg');if(!img)return;cropState.ox+=e.clientX-cropState.sx;cropState.oy+=e.clientY-cropState.sy;img.style.left=cropState.ox+'px';img.style.top=cropState.oy+'px';cropState.sx=e.clientX;cropState.sy=e.clientY;}
function cropMouseUp(){cropState.dragging=false;}
function cropTouchStart(e){if(e.touches.length===1){cropState.dragging=true;cropState.sx=e.touches[0].clientX;cropState.sy=e.touches[0].clientY;e.preventDefault();}}
function cropTouchMove(e){if(!cropState.dragging||!e.touches.length)return;var img=document.getElementById('cropImg');if(!img)return;cropState.ox+=e.touches[0].clientX-cropState.sx;cropState.oy+=e.touches[0].clientY-cropState.sy;img.style.left=cropState.ox+'px';img.style.top=cropState.oy+'px';cropState.sx=e.touches[0].clientX;cropState.sy=e.touches[0].clientY;}
function cropApply(){var canvas=document.createElement('canvas');canvas.width=300;canvas.height=300;var ctx=canvas.getContext('2d');var img=document.getElementById('cropImg');var cont=document.getElementById('cropContainer');if(!img||!cont)return;var rect=cont.getBoundingClientRect();var imgRect=img.getBoundingClientRect();if(imgRect.width===0||imgRect.height===0)return;var sx=(rect.left-imgRect.left)*(img.naturalWidth/imgRect.width);var sy=(rect.top-imgRect.top)*(img.naturalHeight/imgRect.height);var sw=rect.width*(img.naturalWidth/imgRect.width);var sh=rect.height*(img.naturalHeight/imgRect.height);ctx.drawImage(img,sx,sy,sw,sh,0,0,300,300);var data=canvas.toDataURL('image/jpeg',0.85);var prev=document.getElementById(cropState.targetPreview);if(prev)prev.innerHTML='<img src="'+data+'">';if(!window._photoData)window._photoData={};window._photoData[cropState.targetInput]=data;document.getElementById('cropModal').classList.remove('active');toast('Photo cropped!','success');}
function cropCancel(){document.getElementById('cropModal').classList.remove('active');}

function startTimer(){if(votingTimer)clearInterval(votingTimer);votingTimer=setInterval(timerTick,1000);timerTick();}
function stopTimer(){if(votingTimer){clearInterval(votingTimer);votingTimer=null;}}
function timerTick(){updateTimerDisplay();checkTimerExpiry();}
function updateTimerDisplay(){var el=document.getElementById('timerDisplay');if(!el)return;var db=loadDB();if(!db)return;var vs=db.VotingSettings;if(vs.status!=='Open'){el.innerHTML='';return;}if(!vs.round_duration){el.innerHTML='<span class="timer-value">No time limit</span>';return;}if(!vs.round_start_time){el.innerHTML='';return;}var elapsed=Math.floor((Date.now()-vs.round_start_time)/1000);var remaining=Math.max(0,vs.round_duration-elapsed);if(remaining<=0){el.innerHTML='<span class="timer-value" style="color:#ff6b81;">Time\'s up!</span>';return;}var d=Math.floor(remaining/86400),h=Math.floor((remaining%86400)/3600),m=Math.floor((remaining%3600)/60),sec=remaining%60;var parts=[];if(d>0)parts.push(d+'d');if(h>0)parts.push(h+'h');parts.push(m+'m');parts.push(sec+'s');el.innerHTML='Time remaining: <span class="timer-value">'+parts.join(' ')+'</span>';}
function checkTimerExpiry(){var db=loadDB();if(!db)return;var vs=db.VotingSettings;if(vs.status!=='Open'||!vs.round_start_time||!vs.round_duration)return;var elapsed=Math.floor((Date.now()-vs.round_start_time)/1000);if(elapsed>=vs.round_duration){vs.status='Closed';vs.round_start_time=null;vs.round_duration=null;saveDB(db);addLog('Round '+vs.current_round+' auto-closed (timer)');toast('Voting closed - timer expired','warning');if(currentPage==='voting-round1'||currentPage==='voting-round2')navigate('student-dashboard');else if(currentPage==='admin-dashboard')navigate('admin-dashboard',{tab:'election'});}}
function getTimerSeconds(){var dE=document.getElementById('timerDays'),hE=document.getElementById('timerHours'),mE=document.getElementById('timerMins'),sE=document.getElementById('timerSecs');if(!dE)return null;var d=parseInt(dE.value)||0,h=parseInt(hE.value)||0,m=parseInt(mE.value)||0,s=parseInt(sE.value)||0;var total=d*86400+h*3600+m*60+s;return total>0?total:null;}
function showVoteSuccess(candName,round){var el=document.getElementById('voteSuccessOverlay');if(!el)return;el.classList.add('active');var now=new Date();var receipt='Voted for: '+candName+' | Round '+round+' | '+now.toLocaleString();var re=document.getElementById('voteReceipt');if(re)re.textContent=receipt;}
function closeVoteSuccess(){var el=document.getElementById('voteSuccessOverlay');if(el)el.classList.remove('active');navigate('student-dashboard');}
function closeMobileMenu(){mobileMenuOpen=false;var m=document.getElementById('mobileMenu');if(m)m.classList.remove('open');}
function toggleMobileMenu(){mobileMenuOpen=!mobileMenuOpen;var m=document.getElementById('mobileMenu');if(m){if(mobileMenuOpen)m.classList.add('open');else m.classList.remove('open');}}

function navigate(page,params){if(currentPage!==page){_pageHistory.push(currentPage);if(_pageHistory.length>20)_pageHistory=_pageHistory.slice(-20);}currentPage=page;closeMobileMenu();selectedCandId=null;savePage();render(params);window.scrollTo(0,0);startTimer();}
function goBack(){if(_pageHistory.length>0){var prev=_pageHistory.pop();if(prev===currentPage&&_pageHistory.length>0)prev=_pageHistory.pop();currentPage=prev||'home';savePage();render();window.scrollTo(0,0);startTimer();}else{if(currentPage!=='home'){currentPage='home';savePage();render();window.scrollTo(0,0);}}}

function stepperHTML(){var db=loadDB();if(!db)return '';var vs=db.VotingSettings;var steps=[{l:'Setup',n:1},{l:'Round 1',n:2},{l:'Semi',n:3},{l:'Round 2',n:4},{l:'Final',n:5}];var activeStep=0;if(vs.status==='NotStarted')activeStep=0;else if(vs.current_round===1&&vs.status==='Open')activeStep=1;else if(vs.current_round===1&&vs.status==='Closed'&&!vs.semi_results_declared)activeStep=2;else if(vs.semi_results_declared&&vs.current_round===1)activeStep=2;else if(vs.current_round===2&&vs.status==='Open')activeStep=3;else if(vs.current_round===2&&vs.status==='Closed'&&!vs.final_results_declared)activeStep=4;else if(vs.final_results_declared)activeStep=5;var h='<div class="stepper">';for(var i=0;i<steps.length;i++){var done=i<activeStep,active=i===activeStep;h+='<div class="step-wrap"><div class="step-dot'+(done?' done':(active?' active':''))+'">'+(done?'&#10003;':steps[i].n)+'</div><div class="step-label'+(done?' done':(active?' active':''))+'">'+steps[i].l+'</div></div>';if(i<steps.length-1)h+='<div class="step-line'+(i<activeStep?' done':'')+'"></div>';}return h+'</div>';}
function turnoutHTML(round){var db=loadDB();if(!db)return '';var studs=db.Students;var total=studs.length;if(!total)return '<div class="turnout-gauge"><span class="text-sm">No students registered yet</span></div>';var voted=0;for(var i=0;i<studs.length;i++){if(round===2?studs[i].voted_round2:studs[i].voted_round1)voted++;}var pct=total>0?Math.round(voted/total*100):0;return '<div class="turnout-gauge"><span class="text-sm">Turnout</span><div class="gauge-bar-bg"><div class="gauge-bar" style="width:'+pct+'%"></div></div><span class="gauge-pct">'+pct+'%</span></div>';}

function electionStatusHTML(){var db=loadDB();if(!db)return '';var vs=db.VotingSettings;var badge='',timer='',extra='';if(vs.final_results_declared){badge='<span class="status-badge badge-done">Election Complete</span>';extra='<div style="margin-top:10px;"><button class="btn btn-success btn-sm" onclick="navigate(\'final-results\')">View Final Results</button></div>';}else if(vs.semi_results_declared&&vs.current_round!==2){badge='<span class="status-badge badge-open">Semi Results Available</span>';extra='<div style="margin-top:10px;"><button class="btn btn-primary btn-sm" onclick="navigate(\'semi-results\')">View Semi Results</button></div>';}else if(vs.status==='Open'){badge='<span class="status-badge badge-open">Round '+vs.current_round+' &#8212; Voting Open</span>';timer='<div class="timer-display" id="timerDisplay"></div>';extra=turnoutHTML(vs.current_round);}else if(vs.status==='Closed'){badge='<span class="status-badge badge-closed">Round '+vs.current_round+' &#8212; Voting Closed</span>';extra='<p class="text-sm" style="margin-top:8px;">Waiting for admin to proceed.</p>';}else{badge='<span class="status-badge badge-idle">Not Started</span>';}return '<div class="glass election-status-home"><h3>Election Status</h3>'+stepperHTML()+badge+timer+extra+'</div>';}
function backBtn(){return '<div style="margin-bottom:16px;"><button class="btn btn-back" onclick="goBack()">&#8592; Back</button></div>';}

function render(params){var session=getSession();var app=document.getElementById('app');if(!app)return;var nav=buildNav(session);var body='';switch(currentPage){case 'home':body=pageHome(session);break;case 'login':body=pageLogin();break;case 'student-register':body=pageStudentRegister();break;case 'student-login':body=pageStudentLogin();break;case 'admin-register':body=pageAdminRegister();break;case 'admin-login':body=pageAdminLogin();break;case 'admin-unlock':body=pageAdminUnlock(session);break;case 'admin-dashboard':body=pageAdminDashboard(session,params);break;case 'student-dashboard':body=pageStudentDashboard(session);break;case 'voting-round1':body=pageVotingRound(session,1);break;case 'voting-round2':body=pageVotingRound(session,2);break;case 'semi-results':body=pageSemiResults();break;case 'final-results':body=pageFinalResults();break;case 'profile':body=pageProfile(session);break;case 'setup-unlock-pin':body=pageSetupUnlockPin();break;default:body=pageHome(session);}app.innerHTML=nav+'<div class="page-wrap">'+body+'</div>';if(mobileMenuOpen){var m=document.getElementById('mobileMenu');if(m)m.classList.add('open');}}

function buildNav(s){var syncColor=_serverSync?(_syncPending?'#ffa502':'var(--aurora-green)'):'#ff6b81';var syncTitle=_serverSync?(_syncPending?'Saving to Excel...':'Synced to Excel'):'Local only (run server.py)';var syncDot='<span title="'+syncTitle+'" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+syncColor+';box-shadow:0 0 6px '+syncColor+';margin-left:6px;vertical-align:middle;"></span>';var links='',mlinks='';if(s){if(s.role==='admin'&&s.unlocked){links='<button class="btn btn-secondary btn-sm" onclick="navigate(\'admin-dashboard\')">Dashboard</button><button class="btn btn-secondary btn-sm" onclick="navigate(\'profile\')">Profile</button><button class="btn btn-danger btn-sm" onclick="doLogout()">Logout</button>';mlinks='<button class="btn btn-secondary btn-full" onclick="navigate(\'admin-dashboard\');closeMobileMenu()">Dashboard</button><button class="btn btn-secondary btn-full" onclick="navigate(\'profile\');closeMobileMenu()">Profile</button><button class="btn btn-danger btn-full" onclick="doLogout()">Logout</button>';}else if(s.role==='student'){links='<button class="btn btn-secondary btn-sm" onclick="navigate(\'student-dashboard\')">Dashboard</button><button class="btn btn-secondary btn-sm" onclick="navigate(\'profile\')">Profile</button><button class="btn btn-danger btn-sm" onclick="doLogout()">Logout</button>';mlinks='<button class="btn btn-secondary btn-full" onclick="navigate(\'student-dashboard\');closeMobileMenu()">Dashboard</button><button class="btn btn-secondary btn-full" onclick="navigate(\'profile\');closeMobileMenu()">Profile</button><button class="btn btn-danger btn-full" onclick="doLogout()">Logout</button>';}else{links='<button class="btn btn-danger btn-sm" onclick="doLogout()">Logout</button>';mlinks='<button class="btn btn-danger btn-full" onclick="doLogout()">Logout</button>';}}else{links='<button class="btn btn-secondary btn-sm" onclick="navigate(\'login\')">Login</button>';mlinks='<button class="btn btn-secondary btn-full" onclick="navigate(\'login\');closeMobileMenu()">Login</button>';}return '<nav class="navbar"><button class="nav-brand" onclick="navigate(\'home\')">NextCR'+syncDot+'</button><div class="nav-links"><div class="nav-links-desktop">'+links+'</div><button class="hamburger" onclick="toggleMobileMenu()">&#9776;</button></div></nav><div class="mobile-menu" id="mobileMenu">'+mlinks+'</div>';}
function doLogout(){showConfirm('Logout','Are you sure you want to logout?',function(){clearSession();stopTimer();_pageHistory=[];currentPage='home';closeMobileMenu();render();toast('Logged out','info');addLog('User logged out');});}

function pageHome(session){var db=loadDB();if(!db)return '';var cr=db.CurrentCR;var photoHTML=cr.photo?'<img src="'+esc(cr.photo)+'" class="photo-lg photo-xl" onerror="this.style.display=\'none\'">':'<div class="photo-placeholder photo-xl">CR</div>';var detailsHTML='';if(cr.profile_details&&cr.profile_details.length){detailsHTML='<div class="cr-details-list">';for(var i=0;i<cr.profile_details.length;i++){var d=cr.profile_details[i];detailsHTML+='<span class="cr-detail-item"><strong>'+esc(d.category)+':</strong> '+esc(d.value)+'</span>';}detailsHTML+='</div>';}var welcomeMsg='';if(session)welcomeMsg='<div class="glass welcome-banner"><span class="welcome-text">Welcome back, <span class="welcome-name">'+esc(session.name)+'</span>!</span></div>';var getStarted=session?'':'<div style="text-align:center;"><button class="btn btn-primary btn-lg" onclick="navigate(\'login\')">Get Started</button></div>';return '<div class="container fade-in">'+welcomeMsg+electionStatusHTML()+'<div class="glass cr-card"><div>'+photoHTML+'</div><div class="cr-info"><span class="cr-badge">Current Class CR</span><h3>'+esc(cr.name)+'</h3>'+(cr.contact_no?'<p class="text-muted">+91-'+esc(cr.contact_no)+'</p>':'')+(cr.details?'<p class="text-sm">'+esc(cr.details)+'</p>':'')+detailsHTML+'</div></div>'+getStarted+'</div>';}

function pageLogin(){var db=loadDB();if(!db)return '';var needsSetup=!db.AdminUnlockPin;var setupBtn=needsSetup?'<div class="divider">first time?</div><button class="btn btn-purple btn-full" onclick="navigate(\'setup-unlock-pin\')">Setup Admin Unlock PIN</button>':'';return '<div class="page-center"><div class="glass card fade-in">'+backBtn()+'<h2 class="card-title">Login / Register</h2><div style="display:flex;flex-direction:column;gap:12px;"><button class="btn btn-primary btn-full" onclick="navigate(\'student-login\')">Student Login</button><button class="btn btn-purple btn-full" onclick="navigate(\'admin-login\')">Admin Login</button><div class="divider">or register</div><button class="btn btn-secondary btn-full" onclick="navigate(\'student-register\')">Student Register</button><button class="btn btn-secondary btn-full" onclick="navigate(\'admin-register\')">Admin Register</button>'+setupBtn+'</div></div></div>';}

function pageSetupUnlockPin(){var db=loadDB();if(!db)return '';if(db.AdminUnlockPin){navigate('login');return '';}return '<div class="page-center"><div class="glass card fade-in">'+backBtn()+'<h2 class="card-title">Setup Admin Unlock PIN</h2><div class="input-group"><label>Unlock PIN (4-6 digits)</label><div class="input-row"><input type="password" class="input-glass pin-input" id="setupPin" placeholder="* * * *" maxlength="6"><button type="button" class="toggle-pw" onclick="togglePw(\'setupPin\',this)">Show</button></div><div class="field-error" id="setupPinErr"></div></div><div class="input-group"><label>Confirm PIN</label><div class="input-row"><input type="password" class="input-glass pin-input" id="setupPinC" placeholder="* * * *" maxlength="6"><button type="button" class="toggle-pw" onclick="togglePw(\'setupPinC\',this)">Show</button></div><div class="field-error" id="setupPinCErr"></div></div><button class="btn btn-primary btn-full" onclick="doSetupPin()">Set Unlock PIN</button></div></div>';}
function doSetupPin(){var p=(document.getElementById('setupPin')||{}).value||'';p=p.trim();var c=(document.getElementById('setupPinC')||{}).value||'';c=c.trim();hideFieldError('setupPinErr');hideFieldError('setupPinCErr');var ok=true;if(!validatePin(p)){showFieldError('setupPinErr','PIN must be 4-6 digits');setInputState('setupPin','error');ok=false;}else setInputState('setupPin','success');if(p!==c){showFieldError('setupPinCErr','PINs do not match');setInputState('setupPinC','error');ok=false;}else if(ok)setInputState('setupPinC','success');if(!ok)return;var db=loadDB();if(!db)return;db.AdminUnlockPin=hashPw(p);saveDB(db);addLog('Admin Unlock PIN set');navigate('login');toast('Unlock PIN set!','success');}

function pageStudentRegister(){window._photoData={};return '<div class="page-center"><div class="glass card fade-in">'+backBtn()+'<h2 class="card-title">Student Registration</h2><div class="input-group"><label>Student ID (8 digits)</label><input type="text" class="input-glass" id="srSID" placeholder="e.g. 24060356" maxlength="8" oninput="checkSID()"><div class="field-error" id="srSIDErr"></div><div class="field-success" id="srSIDOk"></div></div><div class="input-group"><label>Full Name</label><input type="text" class="input-glass" id="srName" placeholder="Auto-filled from records" readonly style="opacity:0.6;"></div><div class="input-group"><label>Password (min 4 chars)</label><div class="input-row"><input type="password" class="input-glass" id="srPass" placeholder="Create a password" oninput="validateFieldLive(\'srPass\',\'srPassErr\',validatePassword,\'Min 4 characters\');updatePwStrength(\'srPass\',\'srPw\')"><button type="button" class="toggle-pw" onclick="togglePw(\'srPass\',this)">Show</button></div><div class="pw-strength"><div class="pw-bar" id="srPw1"></div><div class="pw-bar" id="srPw2"></div><div class="pw-bar" id="srPw3"></div><div class="pw-bar" id="srPw4"></div><span class="pw-label" id="srPwlabel"></span></div><div class="field-error" id="srPassErr"></div></div><div class="input-group"><label>Contact No</label><div class="contact-row"><span class="contact-prefix">+91-</span><input type="text" class="input-glass" id="srContact" placeholder="10 digit number" maxlength="10" oninput="validateFieldLive(\'srContact\',\'srContactErr\',validateContact,\'Must be 10 digits\')"></div><div class="field-error" id="srContactErr"></div></div><div class="input-group"><label>Profile Photo (optional)</label><div class="photo-upload-area" onclick="document.getElementById(\'srPhoto\').click()"><div class="photo-upload-preview" id="srPhotoP">&#128247;</div><div class="photo-upload-text"><strong>Upload Photo</strong><br>JPG, PNG, WEBP (max 2MB)</div></div><input type="file" id="srPhoto" class="photo-upload-input" accept="image/jpeg,image/png,image/gif,image/webp" onchange="handlePhotoUpload(\'srPhoto\',\'srPhotoP\')"></div><button class="btn btn-primary btn-full" onclick="doStudentReg()">Register</button><p class="form-foot">Already registered? <a onclick="navigate(\'student-login\')">Login here</a></p></div></div>';}
function checkSID(){var sidEl=document.getElementById('srSID');var nf=document.getElementById('srName');if(!sidEl||!nf)return;var sid=sidEl.value.trim();hideFieldError('srSIDErr');var okEl=document.getElementById('srSIDOk');if(okEl)okEl.classList.remove('show');if(sid.length<8){nf.value='';setInputState('srSID','');return;}if(!validateSID(sid)){showFieldError('srSIDErr','Must be exactly 8 digits');setInputState('srSID','error');nf.value='';return;}var db=loadDB();if(!db)return;var entry=null;for(var i=0;i<db.ValidStudentIDs.length;i++){if(db.ValidStudentIDs[i].id===sid){entry=db.ValidStudentIDs[i];break;}}if(!entry){showFieldError('srSIDErr','Student ID not found in records');setInputState('srSID','error');nf.value='';return;}var exists=false;for(var i=0;i<db.Students.length;i++){if(db.Students[i].student_id===sid){exists=true;break;}}if(exists){showFieldError('srSIDErr','This ID is already registered');setInputState('srSID','error');nf.value='';return;}nf.value=entry.name;setInputState('srSID','success');if(okEl){okEl.textContent='Verified: '+entry.name;okEl.classList.add('show');}}
function doStudentReg(){var sid=(document.getElementById('srSID')||{}).value||'';sid=sid.trim();var pass=(document.getElementById('srPass')||{}).value||'';var contact=(document.getElementById('srContact')||{}).value||'';contact=contact.trim();var name=(document.getElementById('srName')||{}).value||'';name=name.trim();var ok=true;['srSIDErr','srPassErr','srContactErr'].forEach(hideFieldError);if(!validateSID(sid)||!name){showFieldError('srSIDErr','Enter a valid Student ID');setInputState('srSID','error');ok=false;}if(!validatePassword(pass)){showFieldError('srPassErr','Min 4 characters');setInputState('srPass','error');ok=false;}if(!validateContact(contact)){showFieldError('srContactErr','Must be 10 digits');setInputState('srContact','error');ok=false;}if(!ok)return;var db=loadDB();if(!db)return;var found=false;for(var i=0;i<db.ValidStudentIDs.length;i++){if(db.ValidStudentIDs[i].id===sid){found=true;break;}}if(!found){toast('Student ID not in records','error');return;}for(var i=0;i<db.Students.length;i++){if(db.Students[i].student_id===sid){toast('Already registered','error');return;}}var photo=(window._photoData&&window._photoData['srPhoto'])||'';db.Students.push({id:uid(),name:name,student_id:sid,password_hash:hashPw(pass),contact_no:contact,photo:photo,voted_round1:false,voted_round2:false,profile_details:[]});saveDB(db);addLog('Student registered: '+name);navigate('student-login');toast('Registration successful!','success');}

function pageStudentLogin(){return '<div class="page-center"><div class="glass card fade-in">'+backBtn()+'<h2 class="card-title">Student Login</h2><div class="input-group"><label>Student ID</label><input type="text" class="input-glass" id="slSID" placeholder="Enter Student ID" maxlength="8"><div class="field-error" id="slSIDErr"></div></div><div class="input-group"><label>Password</label><div class="input-row"><input type="password" class="input-glass" id="slPass" placeholder="Enter password"><button type="button" class="toggle-pw" onclick="togglePw(\'slPass\',this)">Show</button></div><div class="field-error" id="slPassErr"></div></div><button class="btn btn-primary btn-full" onclick="doStudentLogin()">Login</button><p class="form-foot">New student? <a onclick="navigate(\'student-register\')">Register here</a></p></div></div>';}
function doStudentLogin(){var sid=(document.getElementById('slSID')||{}).value||'';sid=sid.trim();var pass=(document.getElementById('slPass')||{}).value||'';hideFieldError('slSIDErr');hideFieldError('slPassErr');var ok=true;if(!validateSID(sid)){showFieldError('slSIDErr','Must be 8 digits');setInputState('slSID','error');ok=false;}if(!pass){showFieldError('slPassErr','Password required');setInputState('slPass','error');ok=false;}if(!ok)return;var db=loadDB();if(!db)return;var h=hashPw(pass);var stu=null;for(var i=0;i<db.Students.length;i++){if(db.Students[i].student_id===sid&&db.Students[i].password_hash===h){stu=db.Students[i];break;}}if(!stu){toast('Invalid Student ID or password','error');return;}setSession({role:'student',user_id:stu.id,name:stu.name});addLog('Student login: '+stu.name);navigate('student-dashboard');toast('Welcome back, '+stu.name+'!','success');}

function pageAdminRegister(){var db=loadDB();if(!db)return '';if(!db.AdminUnlockPin){navigate('setup-unlock-pin');return '';}window._photoData={};return '<div class="page-center"><div class="glass card fade-in">'+backBtn()+'<h2 class="card-title">Admin Registration</h2><div class="input-group"><label>Unlock PIN (to verify)</label><div class="input-row"><input type="password" class="input-glass pin-input" id="arUnlock" placeholder="* * * *" maxlength="6"><button type="button" class="toggle-pw" onclick="togglePw(\'arUnlock\',this)">Show</button></div><div class="field-error" id="arUnlockErr"></div></div><div class="input-group"><label>Full Name</label><input type="text" class="input-glass" id="arName" placeholder="Admin name"><div class="field-error" id="arNameErr"></div></div><div class="input-group"><label>Password (min 4 chars)</label><div class="input-row"><input type="password" class="input-glass" id="arPass" placeholder="Create password" oninput="validateFieldLive(\'arPass\',\'arPassErr\',validatePassword,\'Min 4 characters\');updatePwStrength(\'arPass\',\'arPw\')"><button type="button" class="toggle-pw" onclick="togglePw(\'arPass\',this)">Show</button></div><div class="pw-strength"><div class="pw-bar" id="arPw1"></div><div class="pw-bar" id="arPw2"></div><div class="pw-bar" id="arPw3"></div><div class="pw-bar" id="arPw4"></div><span class="pw-label" id="arPwlabel"></span></div><div class="field-error" id="arPassErr"></div></div><div class="input-group"><label>Admin PIN (4-6 digits)</label><div class="input-row"><input type="password" class="input-glass" id="arPin" placeholder="4-6 digit PIN" maxlength="6" oninput="validateFieldLive(\'arPin\',\'arPinErr\',validatePin,\'Must be 4-6 digits\')"><button type="button" class="toggle-pw" onclick="togglePw(\'arPin\',this)">Show</button></div><div class="field-error" id="arPinErr"></div></div><div class="input-group"><label>Contact No</label><div class="contact-row"><span class="contact-prefix">+91-</span><input type="text" class="input-glass" id="arContact" placeholder="10 digit number" maxlength="10" oninput="validateFieldLive(\'arContact\',\'arContactErr\',validateContact,\'Must be 10 digits\')"></div><div class="field-error" id="arContactErr"></div></div><div class="input-group"><label>Profile Photo (optional)</label><div class="photo-upload-area" onclick="document.getElementById(\'arPhoto\').click()"><div class="photo-upload-preview" id="arPhotoP">&#128247;</div><div class="photo-upload-text"><strong>Upload Photo</strong><br>JPG, PNG, WEBP (max 2MB)</div></div><input type="file" id="arPhoto" class="photo-upload-input" accept="image/jpeg,image/png,image/gif,image/webp" onchange="handlePhotoUpload(\'arPhoto\',\'arPhotoP\')"></div><button class="btn btn-primary btn-full" onclick="doAdminReg()">Register</button><p class="form-foot">Already admin? <a onclick="navigate(\'admin-login\')">Login here</a></p></div></div>';}
function doAdminReg(){var unlock=(document.getElementById('arUnlock')||{}).value||'';unlock=unlock.trim();var name=(document.getElementById('arName')||{}).value||'';name=name.trim();var pass=(document.getElementById('arPass')||{}).value||'';var pin=(document.getElementById('arPin')||{}).value||'';pin=pin.trim();var contact=(document.getElementById('arContact')||{}).value||'';contact=contact.trim();var ok=true;['arUnlockErr','arNameErr','arPassErr','arPinErr','arContactErr'].forEach(hideFieldError);if(!validatePin(unlock)){showFieldError('arUnlockErr','Must be 4-6 digits');ok=false;}if(!name){showFieldError('arNameErr','Name required');ok=false;}if(!validatePassword(pass)){showFieldError('arPassErr','Min 4 characters');ok=false;}if(!validatePin(pin)){showFieldError('arPinErr','Must be 4-6 digits');ok=false;}if(!validateContact(contact)){showFieldError('arContactErr','Must be 10 digits');ok=false;}if(!ok)return;var db=loadDB();if(!db)return;if(hashPw(unlock)!==db.AdminUnlockPin){showFieldError('arUnlockErr','Invalid Unlock PIN');toast('Invalid Unlock PIN','error');return;}for(var i=0;i<db.Admins.length;i++){if(db.Admins[i].name.toLowerCase()===name.toLowerCase()){showFieldError('arNameErr','Name already exists');return;}}var photo=(window._photoData&&window._photoData['arPhoto'])||'';db.Admins.push({id:uid(),name:name,password_hash:hashPw(pass),admin_pin_hash:hashPw(pin),contact_no:contact,photo:photo,profile_details:[]});saveDB(db);addLog('Admin registered: '+name);navigate('admin-login');toast('Admin registered!','success');}

function pageAdminLogin(){return '<div class="page-center"><div class="glass card fade-in">'+backBtn()+'<h2 class="card-title">Admin Login</h2><div class="input-group"><label>Admin Name</label><input type="text" class="input-glass" id="alName" placeholder="Enter admin name"><div class="field-error" id="alNameErr"></div></div><div class="input-group"><label>Password</label><div class="input-row"><input type="password" class="input-glass" id="alPass" placeholder="Enter password"><button type="button" class="toggle-pw" onclick="togglePw(\'alPass\',this)">Show</button></div><div class="field-error" id="alPassErr"></div></div><div class="input-group"><label>Admin PIN</label><div class="input-row"><input type="password" class="input-glass" id="alPin" placeholder="Enter Admin PIN" maxlength="6"><button type="button" class="toggle-pw" onclick="togglePw(\'alPin\',this)">Show</button></div><div class="field-error" id="alPinErr"></div></div><button class="btn btn-primary btn-full" onclick="doAdminLogin()">Login</button><p class="form-foot">New admin? <a onclick="navigate(\'admin-register\')">Register here</a></p></div></div>';}
function doAdminLogin(){var name=(document.getElementById('alName')||{}).value||'';name=name.trim();var pass=(document.getElementById('alPass')||{}).value||'';var pin=(document.getElementById('alPin')||{}).value||'';pin=pin.trim();var ok=true;['alNameErr','alPassErr','alPinErr'].forEach(hideFieldError);if(!name){showFieldError('alNameErr','Name required');ok=false;}if(!pass){showFieldError('alPassErr','Password required');ok=false;}if(!validatePin(pin)){showFieldError('alPinErr','Must be 4-6 digits');ok=false;}if(!ok)return;var db=loadDB();if(!db)return;var ph=hashPw(pass);var pinh=hashPw(pin);var admin=null;for(var i=0;i<db.Admins.length;i++){var a=db.Admins[i];if(a.name.toLowerCase()===name.toLowerCase()&&a.password_hash===ph&&a.admin_pin_hash===pinh){admin=a;break;}}if(!admin){toast('Invalid credentials','error');return;}setSession({role:'admin',user_id:admin.id,name:admin.name,unlocked:false});addLog('Admin login: '+admin.name);navigate('admin-unlock');toast('Welcome, '+admin.name+'!','success');}

function pageAdminUnlock(s){if(!s||s.role!=='admin'){navigate('admin-login');return '';}return '<div class="page-center"><div class="glass card fade-in">'+backBtn()+'<h2 class="card-title">Unlock Dashboard</h2><div class="input-group"><label>Unlock PIN</label><div class="input-row"><input type="password" class="input-glass pin-input" id="auPin" placeholder="* * * *" maxlength="6"><button type="button" class="toggle-pw" onclick="togglePw(\'auPin\',this)">Show</button></div><div class="field-error" id="auPinErr"></div></div><button class="btn btn-primary btn-full" onclick="doUnlock()">Unlock</button></div></div>';}
function doUnlock(){var pin=(document.getElementById('auPin')||{}).value||'';pin=pin.trim();if(!validatePin(pin)){showFieldError('auPinErr','Must be 4-6 digits');return;}var db=loadDB();if(!db)return;if(hashPw(pin)!==db.AdminUnlockPin){showFieldError('auPinErr','Invalid Unlock PIN');toast('Invalid PIN','error');return;}var s=getSession();if(!s)return;s.unlocked=true;setSession(s);addLog('Dashboard unlocked');navigate('admin-dashboard');toast('Dashboard unlocked!','success');}

function pageAdminDashboard(s,params){if(!s||s.role!=='admin'||!s.unlocked){navigate('home');return '';}if(params&&params.tab)adminTab=params.tab;var db=loadDB();if(!db)return '';var vs=db.VotingSettings;var cands=db.Candidates;var studs=db.Students;var vids=db.ValidStudentIDs;var r1v=0,r2v=0;for(var i=0;i<studs.length;i++){if(studs[i].voted_round1)r1v++;if(studs[i].voted_round2)r2v++;}var stats='<div class="stats-grid"><div class="glass stat-card"><div class="stat-num">'+vids.length+'</div><div class="stat-label">Valid IDs</div></div><div class="glass stat-card"><div class="stat-num">'+studs.length+'</div><div class="stat-label">Registered</div></div><div class="glass stat-card"><div class="stat-num">'+cands.length+'</div><div class="stat-label">Candidates</div></div><div class="glass stat-card"><div class="stat-num">'+vs.current_round+'</div><div class="stat-label">Round</div></div><div class="glass stat-card"><div class="stat-num">'+esc(vs.status)+'</div><div class="stat-label">Status</div></div></div>';var tabs=['election','candidates','students','validids','currentcr','logs','settings'];var tabLabels=['Election','Candidates','Students','Valid IDs','Current CR','Logs','Settings'];var tabHTML='<div class="tab-bar">';for(var i=0;i<tabs.length;i++){tabHTML+='<button class="tab-btn'+(tabs[i]===adminTab?' active':'')+'" onclick="adminTab=\''+tabs[i]+'\';navigate(\'admin-dashboard\',{tab:\''+tabs[i]+'\'})">'+tabLabels[i]+'</button>';}tabHTML+='</div>';var content='';
